name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `if:` conditions can't reference `secrets` directly, so mirror it into env first.
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform/build-tools for this project
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor web assets into Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Every push: build an unsigned debug APK you can sideload for testing.
      - name: Build debug APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 150 build.log
          if [ $code -ne 0 ]; then
            {
              grep -n -iE "error:|error :|FAILURE:|What went wrong|Execution failed|Caused by:|AAPT" build.log | head -n 60
              echo "---last 20 lines---"
              tail -n 20 build.log
            } | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | cut -c1-400 | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::$esc"
            done
          fi
          exit $code

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: idle-brew-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Once you add signing secrets (see README's "Play Store release" section),
      # this also produces a signed .aab ready to upload to Google Play.
      - name: Decode signing keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release AAB
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idle-brew-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
