// Try several CDNs in turn, since some networks (school/work/public wifi)
// block one but not another. Whichever loads first wins.
function loadScript(url) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error('failed: ' + url)); };
    document.head.appendChild(s);
  });
}
function loadFirstThatWorks(urls) {
  var attempt = function (i) {
    if (i >= urls.length) return Promise.reject(new Error('all sources failed'));
    return loadScript(urls[i]).catch(function () { return attempt(i + 1); });
  };
  return attempt(0);
}

var REACT_SOURCES = [
  'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',

var REACTDOM_SOURCES = [

  'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
];

  })

      'blocks JavaScript CDNs entirely. Try a different network, such as a personal hotspot.</p></div>';

const storage = {
  async get(key) {
    if (hasClaudeStorage) {
      try { return await window.storage.get(key, false); } catch (e) { return null; }
    }
    try {
      const v = localStorage.getItem(key);
      return v !== null ? { value: v } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    if (hasClaudeStorage) {
      try { return await window.storage.set(key, value, false); } catch (e) { return null; }

const STORE_ITEM_BY_ID = {};
STORE_ITEMS.forEach(i => { STORE_ITEM_BY_ID[i.id] = i; });

function isItemOwned(state, itemId) {
  const item = STORE_ITEM_BY_ID[itemId];
  return !!(item && (item.cost === 0 || (state.store && state.store.owned && state.store.owned[itemId])));
}
function unlockedPayTiers(state) {
  const owned = STORE_ITEMS.filter(i => i.type === 'payTier' && isItemOwned(state, i.id)).map(i => i.amount);
  return [50, ...owned].sort((a, b) => a - b);
}
function effectiveTapCooldown(state) {
  return isItemOwned(state, 'boost_taps') ? Math.round(TAP_COOLDOWN * 0.7) : TAP_COOLDOWN;
}
function categoryEquipmentMultiplier(category, state) {
  return STORE_ITEMS.reduce((mult, item) => {
    if (item.type === 'categoryBoost' && item.category === category && isItemOwned(state, item.id)) {
      return mult + item.boostPct;
    }
    if (item.type === 'theme' && item.category === category && isItemOwned(state, item.id) && state.store && state.store.background === item.id) {
      return mult + item.boostPct;
    }
    return mult;
  }, 1);
}

function taskReward(prestigeLevel) { return 1 + Math.floor(prestigeLevel * 0.25); }
function pickTasks(prestigeLevel) {
  const lvl = prestigeLevel || 0;
  const eligible = TASK_POOL.filter(t => t.minLevel <= lvl).map(t => t.id);
  const ids = eligible.length >= TASKS_PER_RUN ? eligible : TASK_POOL.map(t => t.id);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
  }
  return ids.slice(0, TASKS_PER_RUN);
}

// of cash within 60 seconds (production + tapping + everything else all
// count) to win their trophy. Trophies are permanent and never lost, even
// across prestige. Target numbers here are a first pass, not a final

// --- Achievements: 50 permanent, one-time unlocks. Conditions read live
// state (plus a few lifetime counters that survive prestige), and once
// unlocked an achievement is never revoked even if the underlying stat
// later changes (e.g. turning Auto-Tap back off).
function categoryFullyOwned(category, state) {
  return BEVERAGES.filter(b => b.category === category).every(b => state.beverages[b.id] && state.beverages[b.id].level > 0);
}
function maxProficiency(state) {
  return Object.values(state.beverages).reduce((m, b) => Math.max(m, b.level || 0), 0);
}
function countAtLevel(state, lvl) {
  return Object.values(state.beverages).filter(b => (b.level || 0) >= lvl).length;
}
function bothTiersOwned(category, state) {
  return isItemOwned(state, `equip_${category}_1`) && isItemOwned(state, `equip_${category}_2`);
}
function tierMaxed(state) {
  return PRESTIGE_TREE.some(tier => tier.nodes.every(n => rankOf(state, n.id) >= NODE_MAX_RANK));
}
function countMaxedNodes(state) {
  return PRESTIGE_TREE.reduce((sum, tier) => sum + tier.nodes.filter(n => rankOf(state, n.id) >= NODE_MAX_RANK).length, 0);
}

function defaultRunState(prestigeLevel) {
  const beverages = {};
  BEVERAGES.forEach(b => { beverages[b.id] = { level: b.unlockCost === 0 ? 1 : 0, lastTap: 0 }; });
  return {
    cash: STARTING_CASH, debt: STARTING_DEBT, totalPaid: 0, invested: 0, beverages,
    tapCount: 0, totalEarnedAtRunStart: 0, prestigeSpentThisRun: 0, storeItemsBoughtThisRun: 0,
    tasks: { list: pickTasks(prestigeLevel), completed: {} },
    brewOff: null,
  };
}

function defaultState() {
  return Object.assign({}, defaultRunState(0), {
    totalEarned: 0,
    lastSeen: Date.now(),
    prestige: 0,
    prestigePoints: 0,
    prestigeSpent: 0,

    tutorialDismissed: false,
    store: { background: 'bg_classic', iconPack: 'icons_classic', owned: {} },

    lifetimeTaps: 0,
    lifetimeSideHustles: 0,
    lifetimeDebtClears: 0,
    lifetimeStoreBought: 0,
  });
}

function fmtMoney(n) {
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function IdleBrew() {
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);
  const [confirmingPrestige, setConfirmingPrestige] = useState(false);
  const [tutorialOpen, setTutorialOpen] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);
  const [view, setView] = useState('game');
  const [confirmingReset, setConfirmingReset] = useState(false);
  const [welcomeBack, setWelcomeBack] = useState(null);
  const toastTimer = useRef(null);
  const stateRef = useRef(null);

  const showToast = useCallback((msg, tone) => setToast({ msg, tone: tone || 'neutral', id: Math.random() }), []);

  useEffect(() => {
    let cancelled = false;

      const base = loadedState || defaultState();
      // Merge in any beverages added since this save was created (e.g. new
      // cider/wine tiers), and treat a save that already existed before the

      base.beverages = Object.assign({}, defaultRunState().beverages, base.beverages);
      if (loadedState && base.tutorialDismissed === undefined) base.tutorialDismissed = true;
      if (!base.store) base.store = { background: 'bg_classic', iconPack: 'icons_classic', owned: {} };
      if (base.autoTapEnabled === undefined) base.autoTapEnabled = false;
      if (!base.trophies) base.trophies = {};
      if (!base.achievements) base.achievements = {};
      if (base.lifetimeTaps === undefined) base.lifetimeTaps = 0;
      if (base.lifetimeSideHustles === undefined) base.lifetimeSideHustles = 0;
      if (base.lifetimeDebtClears === undefined) base.lifetimeDebtClears = 0;
      if (base.lifetimeStoreBought === undefined) base.lifetimeStoreBought = 0;
      if (base.brewOff === undefined) base.brewOff = null;
      if (base.invested === undefined) base.invested = 0;
      if (base.tapCount === undefined) base.tapCount = 0;
      if (base.prestigeSpentThisRun === undefined) base.prestigeSpentThisRun = 0;
      if (base.storeItemsBoughtThisRun === undefined) base.storeItemsBoughtThisRun = 0;
      if (base.totalEarnedAtRunStart === undefined) base.totalEarnedAtRunStart = base.totalEarned || 0;
      if (!base.tasks) base.tasks = { list: pickTasks(base.prestige || 0), completed: {} };

      const nowTs = Date.now();
      const elapsedSec = Math.max(0, (nowTs - (base.lastSeen || nowTs)) / 1000);

function HoldableButton(props) {
  const { onAction, disabled, children, style, className } = props;
  const holdDelayRef = useRef(null);
  const intervalRef = useRef(null);

  const stopAll = () => {
    if (holdDelayRef.current) { clearTimeout(holdDelayRef.current); holdDelayRef.current = null; }
    if (intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current = null; }
  };

  const start = () => {
    if (disabled || holdDelayRef.current || intervalRef.current) return;
    onAction(); // fires once immediately, so a quick tap still feels instant
    // Only start rapid-fire if still held after this — a normal tap
    // releases well before the threshold, so it never repeats.
    holdDelayRef.current = setTimeout(() => {
      holdDelayRef.current = null;
      intervalRef.current = setInterval(onAction, 130);
    }, 350);
  };

  useEffect(() => stopAll, []);
  return h('button', {
    className, disabled,
    onMouseDown: start, onMouseUp: stopAll, onMouseLeave: stopAll,
    onTouchStart: (e) => { e.preventDefault(); start(); }, onTouchEnd: stopAll, onTouchCancel: stopAll,
    style: Object.assign({}, style, { WebkitUserSelect: 'none', WebkitTouchCallout: 'none', userSelect: 'none', touchAction: 'manipulation' }),
  }, children);
}

// Hand-drawn pixel sprites (a grid of single characters, each mapped to a
// color) rendered as SVG rects — real 8-bit-style blocky art instead of
// relying on however a device's font renders an emoji glyph.
// Bottle: a small silhouette (neck + body) tinted by category color, meant
// to sit on a backlit glass shelf line rather than a wood plank.
function hashStr(s) {
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
  return hash;
}

// A handful of bottle silhouettes (short & stout, tall & thin, flask-ish,
// long-necked) so bottles in the same category don't all look identical —
// each beverage deterministically picks one based on its own id.
const BOTTLE_SHAPES = [
  { neckW: 2, neckH: 3, bodyW: 7, bodyH: 14 },
  { neckW: 2, neckH: 5, bodyW: 6, bodyH: 17 },
  { neckW: 3, neckH: 4, bodyW: 8, bodyH: 13 },
  { neckW: 2, neckH: 3, bodyW: 9, bodyH: 11 },
];
const LABEL_COLORS = ['#F0E4C4', '#EDE3D0', '#F5D98C', '#E3D4A8'];

// Bottle: neck + body tinted by category, plus a small paper-label band so
// each one reads as its own bottle rather than a category-colored clone.
// Simple hand-drawn ingredient icons per category — a hop cone for beer,
// an apple for cider, a grape cluster for wine, and a grain stalk for
// whiskey (whiskey is distilled from a fermented grain mash — corn, rye,
// wheat, or malted barley — so a generic stalk covers all of them).
function CategoryIcon(props) {
  const { category, size, color, opacity } = props;
  const c = color || '#E0A93E';
  const o = opacity === undefined ? 1 : opacity;
  const wrap = (children) => h('svg', { width: size, height: size, viewBox: '0 0 100 100', style: { opacity: o, display: 'block' } }, children);

  if (category === 'beer') {
    return wrap([
      h('path', { key: 'a', d: 'M50 8 C30 8 18 28 18 48 C18 68 32 88 50 96 C68 88 82 68 82 48 C82 28 70 8 50 8 Z', fill: c }),
      h('path', { key: 'b', d: 'M50 20 C38 20 30 34 30 48 C30 62 40 78 50 84 C60 78 70 62 70 48 C70 34 62 20 50 20 Z', fill: 'none', stroke: 'rgba(0,0,0,0.22)', strokeWidth: 2 }),
      h('line', { key: 'c', x1: 50, y1: 8, x2: 50, y2: 96, stroke: 'rgba(0,0,0,0.18)', strokeWidth: 1.5 }),
    ]);
  }
  if (category === 'cider') {
    return wrap([
      h('path', { key: 'a', d: 'M50 30 C30 22 12 38 12 60 C12 80 30 92 48 92 C49 92 50 90 50 88 C50 90 51 92 52 92 C70 92 88 80 88 60 C88 38 70 22 50 30 Z', fill: c }),
      h('rect', { key: 'b', x: 47, y: 10, width: 5, height: 16, rx: 2, fill: '#6B5636' }),
      h('ellipse', { key: 'c', cx: 62, cy: 16, rx: 12, ry: 7, fill: '#6B8A5E', transform: 'rotate(25 62 16)' }),
    ]);
  }
  if (category === 'wine') {
    const dots = [[50, 20], [38, 34], [62, 34], [28, 50], [50, 50], [72, 50], [38, 66], [62, 66], [50, 80]];
    return wrap(dots.map((d, i) => h('circle', { key: i, cx: d[0], cy: d[1], r: 11, fill: c }))
      .concat([h('path', { key: 'vine', d: 'M50 10 C42 6 34 10 34 18', fill: 'none', stroke: '#5E7C53', strokeWidth: 3, strokeLinecap: 'round' })]));
  }
  if (category === 'whiskey') {
    const heads = [0, 1, 2, 3, 4, 5].map(i => {
      const cy = 22 + i * 11;
      const cx = 50 + (i % 2 === 0 ? -10 : 10);
      const rot = i % 2 === 0 ? -30 : 30;
      return h('ellipse', { key: i, cx, cy, rx: 8, ry: 4, fill: c, transform: `rotate(${rot} ${cx} ${cy})` });
    });
    return wrap([h('line', { key: 'stem', x1: 50, y1: 95, x2: 50, y2: 15, stroke: c, strokeWidth: 3 })].concat(heads));
  }
  return null;
}

function BottleShape(props) {
  const { owned, color, name, bevId } = props;
  const hash = hashStr(bevId);
  const shape = BOTTLE_SHAPES[hash % BOTTLE_SHAPES.length];
  const labelColor = LABEL_COLORS[(hash >> 3) % LABEL_COLORS.length];
  const labelTop = 0.4 + ((hash >> 6) % 3) * 0.12; // vary label position a bit
  return h('div', {
    title: name,
    style: { width: shape.bodyW + 2, flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', opacity: owned ? 1 : 0.16 },
  },
    h('div', { style: { width: shape.neckW, height: shape.neckH, background: owned ? color : 'transparent', border: owned ? 'none' : '1px dashed #6B5D48', borderRadius: '1px 1px 0 0' } }),
    h('div', {
      style: {
        position: 'relative', width: owned ? shape.bodyW : Math.max(4, shape.bodyW - 3), height: owned ? shape.bodyH : Math.max(8, shape.bodyH - 5),
        marginTop: -1, borderRadius: '1px 1px 2px 2px', overflow: 'hidden',
        background: owned ? `linear-gradient(180deg, ${color}E6 0%, ${color}80 70%, ${color}40 100%)` : 'transparent',
        border: owned ? `1px solid ${color}` : '1px dashed #6B5D48',
        boxShadow: owned ? `0 0 4px ${color}55` : 'none',
      },
    },
      owned && h('div', { style: { position: 'absolute', left: 0, right: 0, top: `${labelTop * 100}%`, height: '26%', background: labelColor, opacity: 0.85 } })
    )
  );
}

// Glass: a small tapered silhouette that slides down toward the counter and
// fades out when "away" (being used by a customer), then slides back and
// fades in when it returns to the shelf.
function GlassShape(props) {
  const { away, index, glassCount } = props;
  // Spread landed glasses out along the counter instead of stacking them
  // directly below their shelf slot.
  const spread = 11;
  const xOffset = away ? (index - (glassCount - 1) / 2) * spread : 0;
  return h('div', {
    style: {
      position: 'relative', zIndex: away ? 20 : 1, width: 7, height: 12, flexShrink: 0,
      background: 'linear-gradient(180deg, rgba(240,228,196,0.55), rgba(240,228,196,0.12))',
      border: '1px solid rgba(240,228,196,0.45)', borderRadius: '0 0 2px 2px',
      clipPath: 'polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%)',
      transform: away ? `translate(${xOffset}px, 52px) scale(0.85)` : 'translate(0, 0) scale(1)',
      opacity: away ? 0.92 : 1,
      transition: 'transform 0.9s ease, opacity 0.5s ease',
    },
  });
}

// A backlit glass shelf: a thin bright line with a soft amber glow beneath
// it, with content sitting on top of the line — the signature look from
// the reference photo.
function GlowShelf(props) {
  return h('div', { style: { position: 'relative', paddingBottom: 8, overflow: 'visible' } },
    h('div', { style: { display: 'flex', alignItems: 'flex-end', justifyContent: 'center', gap: props.gap || 2.5, minHeight: props.minHeight || 18 } }, props.children),
    h('div', { style: { position: 'absolute', bottom: 0, left: '4%', right: '4%', height: 2, background: '#E8B94A', borderRadius: 1, boxShadow: '0 0 6px 1px rgba(232,185,74,0.85), 0 5px 16px 3px rgba(232,185,74,0.35)' } })

}

const TOP_SHELF_LEVEL = 25;

// A narrower shelf segment flanking the sign, for beverages that have

function SideShelf(props) {

// A small wall-mounted shadow box per Brew Off trophy — always all four,
// won ones lit up with a glow, unearned ones a dim silhouette in a dashed
// frame rather than a solid box, so it reads as "empty slot" not "bug."
function MedalRack(props) {
  const { state } = props;
  return h('div', { style: { display: 'flex', justifyContent: 'center', gap: 12, marginBottom: 14 } },

          display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: won ? 'linear-gradient(180deg, #2C2116 0%, #150F09 100%)' : '#160F09',

}

function BarDisplay(props) {
  const { state } = props;
  const ownedCount = Object.values(state.beverages).filter(b => b.level > 0).length;
  const glassCount = Math.min(8, Math.max(1, ownedCount));
  const [awaySet, setAwaySet] = useState(() => new Set());

  useEffect(() => {
    let timer = null;
    function tick() {
      setAwaySet(prev => {
        const next = new Set(prev);
        Array.from(next).forEach(i => { if (i >= glassCount) next.delete(i); });
        // Any or all glasses can be away at once now — no cap. Still just
        // one change per tick so it drifts naturally rather than jumping.
        if (next.size < glassCount && Math.random() < 0.6) {
          const candidates = [];
          for (let i = 0; i < glassCount; i++) if (!next.has(i)) candidates.push(i);
          if (candidates.length) next.add(candidates[Math.floor(Math.random() * candidates.length)]);
        } else if (next.size > 0) {
          const arr = Array.from(next);
          next.delete(arr[Math.floor(Math.random() * arr.length)]);
        }
        return next;
      });
      timer = setTimeout(tick, 1800 + Math.random() * 2200);
    }
    timer = setTimeout(tick, 1500);
    return () => clearTimeout(timer);
  }, [glassCount]);

  // Beverages at Lv.25+ graduate to the flanking top shelves either side of
  // the sign; everyone else stays on the main shelf below.
  const topShelfBevs = BEVERAGES.filter(b => state.beverages[b.id] && state.beverages[b.id].level >= TOP_SHELF_LEVEL);
  const topShelfIds = new Set(topShelfBevs.map(b => b.id));
  const leftTop = topShelfBevs.filter((_, i) => i % 2 === 0);
  const rightTop = topShelfBevs.filter((_, i) => i % 2 === 1);
  const mainShelfBevs = BEVERAGES.filter(b => !topShelfIds.has(b.id));

  // The bar's own backdrop reacts to an equipped Theme (not plain cosmetic
  // backgrounds), so buying and switching themes visibly changes the room.
  const equippedItem = STORE_ITEM_BY_ID[state.store.background];
  const activeTheme = equippedItem && equippedItem.type === 'theme' ? equippedItem : null;
  const barBg = activeTheme ? BACKGROUND_THEMES[state.store.background] : 'linear-gradient(180deg, #33272A 0%, #201A1C 55%, #1B140D 100%)';

  return h('div', { id: 'bar-display', style: { position: 'relative', margin: '0 16px 16px', background: barBg, border: '1px solid #3A2C1D', borderRadius: 10, padding: '16px 14px 12px', overflow: 'hidden' } },
    activeTheme && h('div', { style: { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', pointerEvents: 'none' } },
      h(CategoryIcon, { category: activeTheme.category, size: 200, color: CATEGORY_STYLES[activeTheme.category].accent, opacity: 0.07 })
    ),
    h(MedalRack, { state: state }),

    h('div', { style: { display: 'flex', alignItems: 'center', gap: 2, marginBottom: activeTheme ? 6 : 16 } },
      h(SideShelf, { beverages: leftTop, state: state }),
      h('div', { style: { flexShrink: 0, textAlign: 'center', padding: '0 4px' } },
        h('span', {
          style: {
            display: 'inline-block', padding: '8px 16px', borderRadius: 6,
            background: 'rgba(0,0,0,0.35)', border: '1px solid rgba(224,169,62,0.1)',
            boxShadow: '0 0 22px 3px rgba(224,169,62,0.16), inset 0 0 14px rgba(224,169,62,0.06)',
            fontFamily: "'Pacifico', cursive", fontSize: 19, letterSpacing: 0.5, whiteSpace: 'nowrap',
            color: '#FFF8E9',
            WebkitTextStroke: '0.4px rgba(70,40,10,0.3)',
            textShadow: '0 0 2px rgba(255,248,233,0.95), 0 0 6px rgba(255,205,110,0.9), 0 0 14px rgba(224,169,62,0.75), 0 0 28px rgba(224,169,62,0.5), 0 0 48px rgba(212,175,44,0.32)',
            animation: 'neonFlicker 4.2s infinite',
          },
        }, 'Idle Brew')
      ),
      h(SideShelf, { beverages: rightTop, state: state })
    ),

    activeTheme && h('div', { style: { textAlign: 'center', fontSize: 9.5, color: CATEGORY_STYLES[activeTheme.category].accent, marginBottom: 10, fontWeight: 600 } }, `✨ ${activeTheme.name} active — ${activeTheme.desc}`),

    // Main shelf: every beverage below Lv.25, in unlock order, as its own distinct bottle.
    h(GlowShelf, { minHeight: 20 },
      mainShelfBevs.map(b => {
        const cur = state.beverages[b.id];
        const owned = cur && cur.level > 0;
        return h(BottleShape, { key: b.id, bevId: b.id, owned: owned, color: CATEGORY_STYLES[b.category].accent, name: b.name });
      })
    ),

    h('div', { style: { height: 14 } }),

    // Lower shelf: glassware, one per beverage owned (capped). Glasses
    // wander down to visible, spread-out spots on the counter and back,
    // standing in for customers being served.
    h(GlowShelf, { minHeight: 14, gap: 5 },
      Array.from({ length: glassCount }).map((_, i) => h(GlassShape, { key: i, index: i, glassCount: glassCount, away: awaySet.has(i) }))
    ),

    // Bar counter with a glowing front edge, like the under-lit counter in the photo.
    h('div', { style: { position: 'relative', height: 24, marginTop: 20, borderRadius: '3px 3px 2px 2px', background: 'linear-gradient(180deg, #5E4B3C 0%, #3A2C1D 100%)', boxShadow: 'inset 0 2px 2px rgba(255,255,255,0.08)' } },
      h('div', { style: { position: 'absolute', bottom: -2, left: 0, right: 0, height: 2, background: '#E8B94A', boxShadow: '0 0 8px 2px rgba(232,185,74,0.9), 0 6px 18px 4px rgba(232,185,74,0.3)' } }),
      h('div', { style: { position: 'absolute', left: 10, top: 5, display: 'flex', gap: 3 } },
        h('div', { style: { width: 5, height: 5, borderRadius: '50%', background: '#D9702E' } }),
        h('div', { style: { width: 5, height: 5, borderRadius: '50%', background: '#E0913A' } }),
        h('div', { style: { width: 5, height: 5, borderRadius: '50%', background: '#C85A2A' } })
      )
    ),
    h('div', { style: { fontSize: 9.5, color: '#8A7860', textAlign: 'center', marginTop: 8 } }, `${ownedCount} of ${BEVERAGES.length} beverages on the shelves`)
  );
}

function LedgerCard(props) {
  const { id, icon, label, value, color, bleed } = props;
  return h('div', { id: id, style: { position: 'relative', background: '#EDE3D0', borderRadius: 8, padding: '10px 12px', overflow: 'hidden', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.08)' } },
    bleed !== undefined && h('div', { style: { position: 'absolute', left: 0, bottom: 0, width: '100%', height: `${bleed * 100}%`, background: 'linear-gradient(180deg, rgba(161,61,61,0.05), rgba(161,61,61,0.22))', pointerEvents: 'none' } }),
    h('div', { style: { position: 'relative', display: 'flex', alignItems: 'center', gap: 6, color: '#7A6A4E', fontSize: 10.5, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 } },
      h('span', { style: { fontSize: 13 } }, icon), ' ', label
    ),
    h('div', { style: { position: 'relative', fontFamily: 'JetBrains Mono, monospace', fontSize: 17, fontWeight: 700, color: '#2B2018', marginTop: 3 } },
      h('span', { style: { color: color } }, value)
    )
  );
}

function BeverageCard(props) {
  const { bev, bevState, debtUnlocked, cash, rate, nextRate, nextCost, onUnlock, onUpgrade, onTap } = props;
  const icons = props.icons || ICON_PACKS.icons_classic;
  const tapCooldown = props.tapCooldown || TAP_COOLDOWN;
  const [pops, setPops] = useState([]);
  const owned = bevState.level > 0;
  const tapReady = owned && Date.now() - (bevState.lastTap || 0) >= tapCooldown;

  if (!debtUnlocked) {
    return h('div', { style: { background: '#241A12', border: '1px dashed #3A2C1D', borderRadius: 10, padding: 14, display: 'flex', alignItems: 'center', gap: 10, color: '#5A4A38' } },
      h('span', { style: { fontSize: 16 } }, icons.lock),
      h('div', { style: { fontSize: 12, fontFamily: 'JetBrains Mono, monospace' } }, `${bev.name} — pay down ${fmtCompact(bev.unlockDebtPaid)} total to unlock`)
    );
  }

  function handleTap() {
    if (!tapReady) return;
    const bonus = rate * TAP_SECONDS_WORTH;
    const id = Math.random();
    setPops(p => [...p, { id, text: `+${fmtMoney(bonus)}` }]);
    setTimeout(() => setPops(p => p.filter(x => x.id !== id)), 700);
    onTap(bev.id);
  }

  const style = CATEGORY_STYLES[bev.category] || CATEGORY_STYLES.beer;

  return h('div', {
    id: props.domId,
    className: owned ? 'tap-card' : '',
    onClick: owned ? handleTap : undefined,
    style: { position: 'relative', background: style.bg, border: `1px solid ${style.border}`, borderRadius: 10, padding: 12, overflow: 'hidden' },
  },
    pops.map(p => h('div', { key: p.id, style: { position: 'absolute', top: 10, right: 14, fontSize: 13, fontWeight: 700, color: style.accent, fontFamily: 'JetBrains Mono, monospace', animation: 'floatUp 0.7s ease forwards', pointerEvents: 'none' } }, p.text)),
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' } },
      h('div', null,
        h('div', { style: { fontSize: 14, fontWeight: 700, color: '#E8DCC4', fontFamily: 'Fraunces, serif' } }, bev.name),
        owned
          ? h('div', { style: { fontSize: 11, color: style.accentSoft, fontFamily: 'JetBrains Mono, monospace', marginTop: 2 } }, `Proficiency Lv.${bevState.level} · ${fmtCompact(rate)}/sec`)
          : h('div', { style: { fontSize: 11, color: style.accentSoft, fontFamily: 'JetBrains Mono, monospace', marginTop: 2 } }, `Not brewing yet · base ${fmtCompact(bev.baseRate)}/sec`)
      ),
      owned && h('div', { style: { fontSize: 9.5, color: tapReady ? style.accent : '#5A4A38', display: 'flex', alignItems: 'center', gap: 3, fontFamily: 'JetBrains Mono, monospace', flexShrink: 0 } },
        h('span', { style: { fontSize: 11 } }, icons.tap), ' ', tapReady ? 'tap for bonus' : 'cooling down'
      )
    ),
    h('div', { style: { marginTop: 10 } },
      owned
        ? h('button', {
            className: 'btn', disabled: cash < nextCost,
            onClick: (e) => { e.stopPropagation(); onUpgrade(bev.id); },
            style: { width: '100%', background: style.border, border: `1px solid ${style.accentSoft}`, borderRadius: 7, padding: '8px 0', color: style.accent, fontSize: 12, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5 },
          }, h('span', { style: { fontSize: 13 } }, icons.upgrade), ` Improve proficiency — ${fmtCompact(nextCost)} → ${fmtCompact(nextRate)}/sec`)
        : h('button', {
            className: 'btn', disabled: cash < nextCost,
            onClick: (e) => { e.stopPropagation(); onUnlock(bev.id); },
            style: { width: '100%', background: '#2F3A2C', border: '1px solid #4E6247', borderRadius: 7, padding: '8px 0', color: '#9CC28A', fontSize: 12, fontWeight: 600, cursor: 'pointer' },
          }, `Start brewing — ${costLabel(nextCost)}`)
    )
  );
}

function TreeNodeButton(props) {
  const { node, pos, rank, maxed, selected, accent, onClick } = props;
  const fillPct = Math.round((rank / NODE_MAX_RANK) * 100);
  return h('button', {
    onClick, 'aria-label': node.name,
    style: {
      position: 'absolute', left: `${pos.x}%`, top: `${pos.y}%`, transform: 'translate(-50%, -50%)',
      width: 44, height: 44, borderRadius: '50%', cursor: 'pointer', padding: 0,
      border: `2px solid ${selected ? '#FFFFFF' : 'rgba(255,255,255,0.28)'}`,
      background: `linear-gradient(to top, ${accent} ${fillPct}%, rgba(20,14,10,0.55) ${fillPct}%)`,
      boxShadow: maxed ? `0 0 10px ${accent}` : '0 1px 4px rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: 12, fontWeight: 800, color: '#FFF9EC', fontFamily: 'JetBrains Mono, monospace',
      textShadow: '0 1px 2px rgba(0,0,0,0.6)', transition: 'transform 0.1s ease',
    },
  }, maxed ? '★' : String(rank));
}

function PrestigeTierBlock(props) {
  const { tier, state, onBuy } = props;
  const icons = props.icons || ICON_PACKS.icons_classic;
  const [selectedId, setSelectedId] = useState(tier.nodes[0].id);
  const tierUnlocked = state.prestigeSpent >= tier.requiredSpent;

  if (!tierUnlocked) {
    return h('div', { style: { background: '#241A2E', border: '1px solid #3D3350', borderRadius: 10, padding: 12, opacity: 0.6 } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
        h('div', { style: { fontSize: 12, fontWeight: 700, color: '#C9B8E8', fontFamily: 'Fraunces, serif' } }, tier.label),
        h('span', { style: { fontSize: 10, color: '#8A7CA0', fontFamily: 'JetBrains Mono, monospace', display: 'flex', alignItems: 'center', gap: 3 } },
          h('span', { style: { fontSize: 10 } }, icons.lock), ` spend ${tier.requiredSpent} pts to unlock`
        )
      )
    );
  }

  const category = (BEVERAGES.find(b => b.id === tier.nodes[0].beverageId) || {}).category || 'beer';
  const catStyle = CATEGORY_STYLES[category];
  const outline = GLASS_OUTLINES[category] || GLASS_OUTLINES.beer;
  const indexTable = category === 'wine' ? WINE_NODE_INDICES : REAL_NODE_INDICES;
  const realIndices = indexTable[tier.nodes.length] || indexTable[4];
  const polygonPoints = outline.map(p => `${p.x},${p.y}`).join(' ');
  const selectedNode = tier.nodes.find(n => n.id === selectedId) || tier.nodes[0];
  const rank = rankOf(state, selectedNode.id);
  const maxed = rank >= NODE_MAX_RANK;
  const cost = maxed ? null : nodeCostAt(selectedNode, rank);
  const bev = BEVERAGES.find(b => b.id === selectedNode.beverageId);
  const desc = selectedNode.type === 'rate'
    ? `+${Math.round(RATE_EFFECT_PER_RANK * 100)}% ${bev.name} rate / rank`
    : `-${Math.round(COST_EFFECT_PER_RANK * 100)}% ${bev.name} costs / rank`;

  return h('div', { style: { background: '#241A2E', border: '1px solid #3D3350', borderRadius: 10, padding: 12 } },
    h('div', { style: { fontSize: 12, fontWeight: 700, color: '#C9B8E8', fontFamily: 'Fraunces, serif', marginBottom: 8 } }, tier.label),

    h('div', { style: { position: 'relative', height: 190, margin: '4px auto 10px', maxWidth: 220 } },
      h('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', style: { position: 'absolute', inset: 0, width: '100%', height: '100%' } },
        h('polygon', { points: polygonPoints, fill: `${catStyle.accent}22`, stroke: `${catStyle.accent}AA`, strokeWidth: 1.4, strokeLinejoin: 'round' }),
        category === 'cider' && h('path', { d: 'M 75 32 A 16 16 0 0 1 75 68', fill: 'none', stroke: `${catStyle.accent}AA`, strokeWidth: 1.4 })
      ),
      outline.map((pt, i) => {
        const nodeIdx = realIndices.indexOf(i);
        if (nodeIdx === -1) {
          return h('div', {
            key: `deco-${i}`,
            style: { position: 'absolute', left: `${pt.x}%`, top: `${pt.y}%`, transform: 'translate(-50%, -50%)', width: 7, height: 7, borderRadius: '50%', background: catStyle.accent, opacity: 0.5 },
          });
        }
        const node = tier.nodes[nodeIdx];
        return h(TreeNodeButton, {
          key: node.id, node: node, pos: pt,
          rank: rankOf(state, node.id), maxed: rankOf(state, node.id) >= NODE_MAX_RANK,
          selected: node.id === selectedId, accent: catStyle.accent,
          onClick: () => setSelectedId(node.id),
        });
      })
    ),

    h('div', { style: { background: '#2A2233', borderRadius: 8, padding: '9px 11px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 } },
      h('div', { style: { minWidth: 0 } },
        h('div', { style: { fontSize: 11.5, fontWeight: 600, color: '#E5D9FF' } }, selectedNode.name, ' ', h('span', { style: { color: '#8A7CA0', fontWeight: 400 } }, `Lv.${rank}/${NODE_MAX_RANK}`)),
        h('div', { style: { fontSize: 10, color: '#8A7CA0', fontFamily: 'JetBrains Mono, monospace' } }, desc)
      ),
      h('button', {
        className: 'btn', disabled: maxed || state.prestigePoints < cost,
        onClick: () => onBuy(selectedNode.id),
        style: { flexShrink: 0, background: maxed ? 'none' : '#4A3D6B', border: `1px solid ${maxed ? '#3D3350' : '#6B5A9C'}`, borderRadius: 6, padding: '6px 10px', color: maxed ? '#8A7CA0' : '#E5D9FF', fontSize: 11, fontWeight: 600, cursor: maxed ? 'default' : 'pointer' },
      }, maxed ? 'Maxed' : `${cost} pt${cost === 1 ? '' : 's'}`)
    )
  );
}

function PrestigeTreeView(props) {
  const { state, icons, onBuy, onToggleAutoTap } = props;
  const anyMastered = anyBeverageMaxed(state);
  const complete = isTreeComplete(state);
  return h('div', { style: { padding: '4px 16px 0' } },
    h('div', { style: { margin: '10px 0 18px', background: '#2A2233', border: '1px solid #4A3D5C', borderRadius: 10, padding: '10px 14px' } },
      h('div', { style: { fontSize: 12, color: '#C9B8E8', fontWeight: 600 } }, `${icons.prestige} ${state.prestigePoints} prestige points to spend`),
      h('div', { style: { fontSize: 10.5, color: '#8A7CA0', marginTop: 3 } }, 'Permanent upgrades — never lost, even when you prestige.')
    ),
    anyMastered && h('div', { style: { margin: '0 0 18px', background: 'linear-gradient(135deg, #3A2E1A, #2A2233)', border: '1px solid #D4AF2C', borderRadius: 10, padding: '12px 14px' } },
      h('div', { style: { fontSize: 12.5, color: '#F0D98C', fontWeight: 700, marginBottom: 4 } }, complete ? '🏆 Tree Mastered' : '⭐ Beverage Mastered'),
      h('div', { style: { fontSize: 10.5, color: '#C9BBA3', marginBottom: 10, lineHeight: 1.5 } },
        complete
          ? 'Every node in the tree is maxed. Turn on Auto-Tap and every beverage taps itself for its bonus the moment it comes off cooldown.'
          : "Any beverage with both its Recipe and Deals nodes fully maxed (Lv.5/5) will tap itself automatically once Auto-Tap is on — no need to max the whole tree first. More beverages join in as you max out their nodes."
      ),
      h('button', {
        className: 'btn', onClick: onToggleAutoTap,
        style: { width: '100%', background: state.autoTapEnabled ? '#3C4F35' : '#3A2C1D', border: `1px solid ${state.autoTapEnabled ? '#6B8A5E' : '#5A4630'}`, borderRadius: 8, padding: '9px 0', color: state.autoTapEnabled ? '#D7E5CE' : '#E0A93E', fontSize: 12.5, fontWeight: 700, cursor: 'pointer' },
      }, state.autoTapEnabled ? '✓ Auto-Tap is ON' : 'Turn on Auto-Tap')
    ),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
      PRESTIGE_TREE.map(tier => h(PrestigeTierBlock, { key: tier.tier, tier: tier, state: state, onBuy: onBuy, icons: icons }))
    )
  );
}

function BossCard(props) {
  const { boss, state, now, icons, onStart, onCancel } = props;
  const won = !!state.trophies[boss.id];
  const unlocked = state.prestige >= boss.minLevel;
  const active = state.brewOff && state.brewOff.bossId === boss.id;
  const otherActive = state.brewOff && state.brewOff.bossId !== boss.id;

  if (!unlocked) {
    return h('div', { style: { background: '#241A12', border: '1px dashed #3A2C1D', borderRadius: 10, padding: 14, display: 'flex', alignItems: 'center', gap: 10, color: '#5A4A38' } },
      h('span', { style: { fontSize: 18 } }, icons.lock),
      h('div', { style: { fontSize: 12, fontFamily: 'JetBrains Mono, monospace' } }, `Reach prestige generation ${boss.minLevel + 1} to challenge ${boss.name}`)
    );
  }

  const earned = active ? Math.max(0, state.totalEarned - state.brewOff.startEarned) : 0;
  const pct = active ? Math.min(100, (earned / boss.target) * 100) : 0;
  const secondsLeft = active ? Math.max(0, Math.ceil((state.brewOff.endsAt - now) / 1000)) : 0;

  return h('div', { style: { background: won ? 'linear-gradient(135deg, #3A2E1A, #2A2233)' : '#2C2116', border: `1px solid ${won ? '#D4AF2C' : '#3A2C1D'}`, borderRadius: 10, padding: 12 } },
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
      h('div', { style: { fontSize: 26, flexShrink: 0 } }, boss.icon),
      h('div', { style: { flex: 1, minWidth: 0 } },
        h('div', { style: { fontSize: 13.5, fontWeight: 700, color: '#E8DCC4', fontFamily: 'Fraunces, serif' } }, boss.name),
        h('div', { style: { fontSize: 10.5, color: won ? '#F0D98C' : '#8A7860', marginTop: 1 } }, won ? `✓ ${boss.trophy} won` : `${boss.trophy} · earn ${fmtCompact(boss.target)} in 60s`)
      )
    ),
    active && h('div', { style: { marginTop: 10 } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: '#C9BBA3', marginBottom: 4, fontFamily: 'JetBrains Mono, monospace' } },
        h('span', null, `${fmtCompact(earned)} / ${fmtCompact(boss.target)}`),
        h('span', null, `${secondsLeft}s left`)
      ),
      h('div', { style: { height: 8, borderRadius: 4, background: '#1B140D', overflow: 'hidden' } },
        h('div', { style: { height: '100%', width: `${pct}%`, background: 'linear-gradient(90deg, #E0A93E, #D4AF2C)', transition: 'width 0.2s linear' } })
      ),
      h('button', { className: 'btn', onClick: onCancel, style: { marginTop: 8, width: '100%', background: 'none', border: '1px solid #4A3826', borderRadius: 7, padding: '6px 0', color: '#8A7860', fontSize: 11, cursor: 'pointer' } }, 'Give up')
    ),
    !active && !won && h('button', {
      className: 'btn', disabled: otherActive, onClick: () => onStart(boss.id),
      style: { marginTop: 10, width: '100%', background: '#3A2C1D', border: '1px solid #5A4630', borderRadius: 7, padding: '8px 0', color: otherActive ? '#5A4A38' : '#E0A93E', fontSize: 12, fontWeight: 600, cursor: otherActive ? 'default' : 'pointer' },
    }, otherActive ? 'Finish your current Brew Off first' : `Challenge ${boss.name}`)
  );
}

function TutorialOverlay(props) {
  const { step, onNext, onBack, onClose } = props;
  const total = TUTORIAL_STEPS.length;
  const isLast = step === total - 1;
  const current = TUTORIAL_STEPS[step];
  const [rect, setRect] = useState(null);

  useEffect(() => {
    let cancelled = false;
    let rafId = null;
    setRect(null);

    function measureNow() {
      if (cancelled || !current.targetId) return;
      const el = document.getElementById(current.targetId);
      if (!el) return;
      const r = el.getBoundingClientRect();
      setRect(prev => {
        const next = { top: r.top, left: r.left, width: r.width, height: r.height };
        if (prev && prev.top === next.top && prev.left === next.left && prev.width === next.width && prev.height === next.height) return prev;
        return next;
      });
    }
    function scheduleMeasure() {
      if (rafId) return;
      rafId = requestAnimationFrame(() => { rafId = null; measureNow(); });
    }

    let scrollTimer = null;
    if (current.targetId) {
      const el = document.getElementById(current.targetId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      scrollTimer = setTimeout(measureNow, 380);
    }

    window.addEventListener('scroll', scheduleMeasure, true);
    window.addEventListener('resize', scheduleMeasure);
    const keepInSync = setInterval(measureNow, 500);

    return () => {
      cancelled = true;
      if (rafId) cancelAnimationFrame(rafId);
      if (scrollTimer) clearTimeout(scrollTimer);
      window.removeEventListener('scroll', scheduleMeasure, true);
      window.removeEventListener('resize', scheduleMeasure);
      clearInterval(keepInSync);
    };
  }, [step, current.targetId]);

  const pad = 8;
  const viewportH = typeof window !== 'undefined' ? window.innerHeight : 800;
  let calloutStyle = { position: 'fixed', left: 16, right: 16, maxWidth: 460, margin: '0 auto', zIndex: 103 };
  if (rect) {
    const spaceBelow = viewportH - (rect.top + rect.height);
    const spaceAbove = rect.top;
    if (spaceBelow >= 190 || spaceBelow >= spaceAbove) {
      calloutStyle.top = Math.min(viewportH - 20, rect.top + rect.height + pad + 14);
    } else {
      calloutStyle.bottom = Math.max(16, viewportH - rect.top + pad + 14);
    }
  } else {
    calloutStyle.top = '50%';
    calloutStyle.transform = 'translateY(-50%)';
  }

  return h('div', { style: { position: 'fixed', inset: 0, zIndex: 100 }, onClick: onClose },
    // Dimmed backdrop everywhere, with a cutout around the target via a huge box-shadow.
    rect
      ? h('div', {
          style: {
            position: 'fixed', top: rect.top - pad, left: rect.left - pad,
            width: rect.width + pad * 2, height: rect.height + pad * 2,
            borderRadius: 12, border: '2px solid #E0A93E',
            boxShadow: '0 0 0 9999px rgba(10,7,4,0.8)',
            zIndex: 101,
          },
        })
      : h('div', { style: { position: 'fixed', inset: 0, background: 'rgba(10,7,4,0.8)', zIndex: 101 } }),

    h('div', {
      onClick: (e) => e.stopPropagation(),
      style: Object.assign({ background: '#2C2116', border: '1px solid #4A3826', borderRadius: 14, padding: '18px 18px 20px', boxShadow: '0 8px 30px rgba(0,0,0,0.5)' }, calloutStyle),
    },
      h('div', { style: { display: 'flex', justifyContent: 'center', gap: 5, marginBottom: 14 } },
        TUTORIAL_STEPS.map((_, i) => h('div', { key: i, style: { width: i === step ? 16 : 6, height: 6, borderRadius: 3, background: i === step ? '#E0A93E' : '#4A3826', transition: 'width 0.2s ease' } }))
      ),
      h('div', { style: { fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 700, color: '#E0A93E', marginBottom: 8 } }, current.title),
      h('div', { style: { fontSize: 13.5, color: '#C9BBA3', lineHeight: 1.6, marginBottom: 20 } }, current.body),
      h('div', { style: { display: 'flex', gap: 8 } },
        step > 0 && h('button', { onClick: onBack, style: { flex: 1, background: 'none', border: '1px solid #4A3826', borderRadius: 8, padding: '10px 0', color: '#8A7860', fontSize: 13, fontWeight: 600, cursor: 'pointer' } }, 'Back'),
        h('button', {
          onClick: isLast ? onClose : onNext,
          style: { flex: 2, background: '#E0A93E', border: 'none', borderRadius: 8, padding: '10px 0', color: '#241A12', fontSize: 13, fontWeight: 700, cursor: 'pointer' },
        }, isLast ? "Let's brew!" : 'Next')
      ),
      !isLast && h('button', { onClick: onClose, style: { display: 'block', margin: '12px auto 0', background: 'none', border: 'none', color: '#6B5D48', fontSize: 11.5, cursor: 'pointer' } }, 'Skip tutorial')
    )
  );
}

function SplashScreen(props) {
  const { fading } = props;
  return h('div', {
    style: {
      position: 'fixed', inset: 0, zIndex: 200,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      background: 'linear-gradient(180deg, #241A12 0%, #150F09 100%)',
      opacity: fading ? 0 : 1,
      transition: 'opacity 0.9s ease',
      pointerEvents: fading ? 'none' : 'auto',
    },
  },
    h('img', {
      src: `data:image/jpeg;base64,${LOGO_B64}`,
      style: { width: 220, height: 220, borderRadius: 24, boxShadow: '0 12px 40px rgba(0,0,0,0.55)', marginBottom: 22, objectFit: 'cover' },
    }),
    h('div', { style: { fontFamily: "'Pacifico', cursive", fontSize: 26, color: '#FFF8E9', letterSpacing: 0.5,
      textShadow: '0 0 4px rgba(255,205,110,0.9), 0 0 12px rgba(224,169,62,0.7), 0 0 26px rgba(224,169,62,0.4)' } }, 'Idle Brew'),
    h('div', { style: { fontSize: 10.5, color: '#8A7860', marginTop: 10, letterSpacing: 2, textTransform: 'uppercase' } }, 'A Cyber Dair Tech Production'),
    h('div', {
      style: {
        marginTop: 28, width: 120, height: 3, borderRadius: 2, background: 'rgba(224,169,62,0.15)', overflow: 'hidden',
      },
    },
      h('div', { style: { width: '100%', height: '100%', background: '#E0A93E', animation: 'splashLoad 2.1s ease-in-out forwards' } })
    )
  );
}

function AppRoot() {
  const [phase, setPhase] = useState('visible');
  useEffect(() => {
    let t1 = setTimeout(() => setPhase('fading'), 2200);
    let t2 = setTimeout(() => setPhase('gone'), 3100);
    function onPageShow(e) {
      // A bfcache restore (e.g. swiping back to a previously-open tab)
      // keeps React state alive instead of re-running this module, so the
      // splash wouldn't otherwise replay. Force it to run again.
      if (e.persisted) {
        clearTimeout(t1); clearTimeout(t2);
        setPhase('visible');
        t1 = setTimeout(() => setPhase('fading'), 2200);
        t2 = setTimeout(() => setPhase('gone'), 3100);
      }
    }
    window.addEventListener('pageshow', onPageShow);
    return () => {
      clearTimeout(t1); clearTimeout(t2);
      window.removeEventListener('pageshow', onPageShow);
    };
  }, []);
  return h(React.Fragment, null,
    h(IdleBrew),
    phase !== 'gone' && h(SplashScreen, { fading: phase === 'fading' })
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h(ErrorBoundary, null, h(AppRoot)));
} catch (err) {
  document.getElementById('root').innerHTML = '<div class="idlebrew-msg"><h2>Something went wrong</h2><p>' + ((err && err.message) || 'Unknown error') + '</p></div>';
}

} // end runIdleBrew
