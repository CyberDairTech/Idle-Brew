<script>
// Try several CDNs in turn, since some networks (school/work/public wifi)
// block one but not another. Whichever loads first wins.
function loadScript(url) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error('failed: ' + url)); };
    document.head.appendChild(s);
  });
}
function loadFirstThatWorks(urls) {
  var attempt = function (i) {
    if (i >= urls.length) return Promise.reject(new Error('all sources failed'));
    return loadScript(urls[i]).catch(function () { return attempt(i + 1); });
  };
  return attempt(0);
}

const hasClaudeStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
const storage = {
  async get(key) {
    if (hasClaudeStorage) {
      try { return await window.storage.get(key, false); } catch (e) { return null; }
    }
    try {
      const v = localStorage.getItem(key);
      return v !== null ? { value: v } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    if (hasClaudeStorage) {
      try { return await window.storage.set(key, value, false); } catch (e) { return null; }
    }
    try { localStorage.setItem(key, value); return { value }; } catch (e) { return null; }
  },
};

const TASK_BY_ID = {};
TASK_POOL.forEach(t => { TASK_BY_ID[t.id] = t; });

function taskReward(prestigeLevel) { return 2 + Math.floor(prestigeLevel * 1.5); }
function pickTasks(prestigeLevel) {
  const lvl = prestigeLevel || 0;
  const eligible = TASK_POOL.filter(t => t.minLevel <= lvl).map(t => t.id);
  const ids = eligible.length >= TASKS_PER_RUN ? eligible : TASK_POOL.map(t => t.id);
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
  }
  return ids.slice(0, TASKS_PER_RUN);
}

// --- Brew Off: a timed boss-battle challenge. Once your prestige level
// clears a boss's threshold, you can challenge them: earn the target amount
// of cash within 60 seconds (production + tapping + everything else all
// count) to win their trophy. Trophies are permanent and never lost, even
// across prestige. Target numbers here are a first pass, not a final
// balance — worth tuning once there's real play data on what income looks
// like at each of these prestige levels.
const BREW_OFF_DURATION_MS = 60000;
const BREW_OFF_BOSSES = [
  { id: 'boss10', minLevel: 10, name: 'Big Sal, the Brewhouse Bull', trophy: 'Bronze BrewMaster Trophy', icon: '🥉', target: 50000 },
  { id: 'boss20', minLevel: 20, name: 'Coldbrew Katrina', trophy: 'Silver BrewMaster Trophy', icon: '🥈', target: 5000000 },

];
const BREW_OFF_BY_ID = {};
BREW_OFF_BOSSES.forEach(b => { BREW_OFF_BY_ID[b.id] = b; });

function defaultRunState(prestigeLevel) {
  const beverages = {};
  BEVERAGES.forEach(b => { beverages[b.id] = { level: b.unlockCost === 0 ? 1 : 0, lastTap: 0 }; });
  return {
    cash: STARTING_CASH, debt: STARTING_DEBT, totalPaid: 0, invested: 0, beverages,
    tapCount: 0, totalEarnedAtRunStart: 0, prestigeSpentThisRun: 0, storeItemsBoughtThisRun: 0,
    tasks: { list: pickTasks(prestigeLevel), completed: {} },
    brewOff: null,
  };
}

function defaultState() {
  return Object.assign({}, defaultRunState(0), {
    totalEarned: 0,
    lastSeen: Date.now(),
    prestige: 0,
    prestigePoints: 0,
    prestigeSpent: 0,
    prestigeUpgrades: {},
    tutorialDismissed: false,
    store: { background: 'bg_classic', iconPack: 'icons_classic', owned: {} },
    autoTapEnabled: false,
    trophies: {},
  });

function fmtMoney(n) {
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n) {
  return Math.round(n).toLocaleString();
}
// Once a value's full comma-formatted dollar string gets long enough, it
// overflows the fixed-width cards it's shown in — this switches to a
// short K/M/B/T suffix instead. Small numbers are unaffected.
function fmtCompact(n) {
  const neg = n < 0;
  const abs = Math.abs(n);
  let out;
  if (abs >= 1e12) out = (abs / 1e12).toFixed(2) + 'T';
  else if (abs >= 1e9) out = (abs / 1e9).toFixed(2) + 'B';
  else if (abs >= 1e6) out = (abs / 1e6).toFixed(2) + 'M';
  else return fmtMoney(n);
  return (neg ? '-$' : '$') + out;
}
function costLabel(n) { return n <= 0 ? 'Free' : fmtCompact(n); }
function rankOf(state, nodeId) { return state.prestigeUpgrades[nodeId] || 0; }
function beverageNodesMaxed(bevId, state) {
  return rankOf(state, `${bevId}_rate`) >= NODE_MAX_RANK && rankOf(state, `${bevId}_cost`) >= NODE_MAX_RANK;
}
function isTreeComplete(state) {
  return PRESTIGE_TREE.every(tier => tier.nodes.every(node => rankOf(state, node.id) >= NODE_MAX_RANK));
}
function anyBeverageMaxed(state) {
  return BEVERAGES.some(b => beverageNodesMaxed(b.id, state));
}
function autoTappingCount(state) {
  return BEVERAGES.filter(b => {
    const cur = state.beverages[b.id];
    return cur && cur.level > 0 && beverageNodesMaxed(b.id, state);
  }).length;
}
function rateMultiplier(bevId, state) {
  const rank = rankOf(state, `${bevId}_rate`);
  return 1 + rank * RATE_EFFECT_PER_RANK;
}
function costMultiplier(bevId, state) {
  const rank = rankOf(state, `${bevId}_cost`);
  return Math.max(0.4, 1 - rank * COST_EFFECT_PER_RANK);
}
function rateOf(bev, level, state) {
  if (level <= 0) return 0;
  let r = bev.baseRate * level * rateMultiplier(bev.id, state) * categoryEquipmentMultiplier(bev.category, state);
  if (isItemOwned(state, 'boost_double')) r *= 2;
  return r;
}
function effectiveUnlockCost(bev, state) {
  return Math.max(0, Math.round(bev.unlockCost * costMultiplier(bev.id, state)));
}
function effectiveUpgradeBaseCost(bev, state) {
  return bev.upgradeBaseCost * costMultiplier(bev.id, state);
}
function upgradeCostOf(bev, level, state) {
  return Math.ceil(effectiveUpgradeBaseCost(bev, state) * Math.pow(bev.growth, Math.max(0, level - 1)));
}
function investIncomeRate(state) {
  return (state.invested || 0) * INVEST_RATE_PER_SEC;
}
function totalRateOf(state) {
  return BEVERAGES.reduce((sum, b) => sum + rateOf(b, (state.beverages[b.id] && state.beverages[b.id].level) || 0, state), 0) + investIncomeRate(state);
}
function nodeCostAt(node, rank) {
  return Math.ceil(node.baseCost * Math.pow(NODE_COST_GROWTH, rank));
}
function pointsForPrestige(currentLevel) {
  return PRESTIGE_POINTS_BASE + currentLevel * PRESTIGE_POINTS_PER_LEVEL;
}
function debtForRun(newLevel) {
  return Math.round(STARTING_DEBT * Math.pow(DEBT_GROWTH_PER_PRESTIGE, newLevel));
}
function flatInterestPerSec(state) {
  return debtForRun(state.prestige) * DEBT_FLAT_INTEREST_RATIO;
}
// Shared by both the initial page-load catch-up and the visibility-change
// catch-up (mobile browsers throttle/pause timers in the background, so a
// locked phone or backgrounded tab needs this recomputed on return, not
// just once at page load).
function applyOfflineCatchUp(base, elapsedSec) {
  const rate = totalRateOf(base);
  const earned = rate * elapsedSec;
  const startingDebt = settleDebt(base.debt);
  const debt = startingDebt > 0 ? settleDebt(startingDebt + flatInterestPerSec(base) * elapsedSec) : 0;
  return { cash: base.cash + earned, totalEarned: (base.totalEarned || 0) + earned, debt, earned };
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Fermentary render error:', error, info); }
  render() {
    if (this.state.error) {
      return h('div', { className: 'fermentary-msg' },
        h('h2', null, 'Something went wrong'),
        h('p', null, String((this.state.error && this.state.error.message) || this.state.error))
      );
    }
    return this.props.children;
  }
}

function Fermentary() {
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);
  const [confirmingPrestige, setConfirmingPrestige] = useState(false);
  const [tutorialOpen, setTutorialOpen] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);
  const [view, setView] = useState('game');
  const [confirmingReset, setConfirmingReset] = useState(false);
  const toastTimer = useRef(null);
  const stateRef = useRef(null);
  stateRef.current = state;

  const showToast = useCallback((msg, tone) => setToast({ msg, tone: tone || 'neutral', id: Math.random() }), []);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let loadedState = null;
      try {
        const res = await storage.get(SAVE_KEY);
        if (res && res.value) loadedState = JSON.parse(res.value);
      } catch (e) { loadedState = null; }

      const base = loadedState || defaultState();
      // Merge in any beverages added since this save was created (e.g. new
      // cider/wine tiers), and treat a save that already existed before the
      // tutorial existed as one that doesn't need to see it.
      base.beverages = Object.assign({}, defaultRunState().beverages, base.beverages);
      if (loadedState && base.tutorialDismissed === undefined) base.tutorialDismissed = true;
      if (!base.store) base.store = { background: 'bg_classic', iconPack: 'icons_classic', owned: {} };
      if (base.autoTapEnabled === undefined) base.autoTapEnabled = false;
      if (!base.trophies) base.trophies = {};
      if (base.brewOff === undefined) base.brewOff = null;
      if (base.invested === undefined) base.invested = 0;
      if (base.tapCount === undefined) base.tapCount = 0;
      if (base.prestigeSpentThisRun === undefined) base.prestigeSpentThisRun = 0;
      if (base.storeItemsBoughtThisRun === undefined) base.storeItemsBoughtThisRun = 0;
      if (base.totalEarnedAtRunStart === undefined) base.totalEarnedAtRunStart = base.totalEarned || 0;
      if (!base.tasks) base.tasks = { list: pickTasks(base.prestige || 0), completed: {} };

      const nowTs = Date.now();
      const elapsedSec = Math.max(0, (nowTs - (base.lastSeen || nowTs)) / 1000);
      const result = applyOfflineCatchUp(base, elapsedSec);

      const next = Object.assign({}, base, { cash: result.cash, totalEarned: result.totalEarned, debt: result.debt, lastSeen: nowTs });
      if (!cancelled) {
        setState(next);
        setLoaded(true);
        if (!next.tutorialDismissed) setTutorialOpen(true);
        if (loadedState && elapsedSec > 20) {
          showToast(`Welcome back — earned ${fmtMoney(result.earned)} while away (${Math.round(elapsedSec / 60)} min).`, 'good');
        }
      }
    })();
    return () => { cancelled = true; };
  }, [showToast]);

  useEffect(() => {
    if (!loaded) return;
    const dt = TICK_MS / 1000;
    const id = setInterval(() => {
      setState(prev => {
        if (!prev) return prev;
        let cash = prev.cash;
        let totalEarned = prev.totalEarned;
        let tapCount = prev.tapCount || 0;
        let beverages = prev.beverages;

        if (prev.autoTapEnabled) {
          const now = Date.now();
          const cooldown = effectiveTapCooldown(prev);
          let changed = false;
          const nextBeverages = Object.assign({}, beverages);
          BEVERAGES.forEach(bev => {
            const cur = beverages[bev.id];
            if (!cur || cur.level < 1) return;
            if (!beverageNodesMaxed(bev.id, prev)) return;
            if (now - (cur.lastTap || 0) < cooldown) return;
            const bonus = rateOf(bev, cur.level, prev) * TAP_SECONDS_WORTH;
            cash += bonus;
            totalEarned += bonus;
            tapCount += 1;
            nextBeverages[bev.id] = Object.assign({}, cur, { lastTap: now });
            changed = true;
          });
          if (changed) beverages = nextBeverages;
        }

        const rate = totalRateOf(prev);
        const income = rate * dt;
        const debt = isDebtCleared(prev.debt) ? 0 : settleDebt(prev.debt + flatInterestPerSec(prev) * dt);
        return Object.assign({}, prev, { cash: cash + income, totalEarned: totalEarned + income, debt, tapCount, beverages });
      });
    }, TICK_MS);
    return () => clearInterval(id);
  }, [loaded]);

  useEffect(() => {
    if (!loaded) return;
    const id = setInterval(() => {
      if (stateRef.current) {
        const toSave = Object.assign({}, stateRef.current, { lastSeen: Date.now() });
        storage.set(SAVE_KEY, JSON.stringify(toSave));
      }
    }, 4000);
    return () => clearInterval(id);
  }, [loaded]);

  useEffect(() => {
    const handler = () => {
      if (stateRef.current) {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(Object.assign({}, stateRef.current, { lastSeen: Date.now() }))); } catch (e) {}
      }
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, []);

  // Locking the phone or backgrounding the tab doesn't reload the page, so
  // the load-time catch-up above never re-runs on its own — and mobile
  // browsers throttle or fully pause setInterval while backgrounded, so the
  // live ticker silently misses that whole stretch of time. This catches
  // the gap up the moment the tab becomes visible again, using whatever
  // lastSeen was last recorded (a few seconds stale at worst).
  useEffect(() => {
    if (!loaded) return;
    function catchUp() {
      if (document.hidden) return;
      const prev = stateRef.current;
      if (!prev) return;
      const nowTs = Date.now();
      const elapsedSec = Math.max(0, (nowTs - (prev.lastSeen || nowTs)) / 1000);
      if (elapsedSec < 2) {
        setState(p => p && Object.assign({}, p, { lastSeen: nowTs }));
        return;
      }
      const result = applyOfflineCatchUp(prev, elapsedSec);
      setState(p => p && Object.assign({}, p, { cash: result.cash, totalEarned: result.totalEarned, debt: result.debt, lastSeen: nowTs }));
      if (elapsedSec > 20) {
        showToast(`Welcome back — earned ${fmtMoney(result.earned)} while away (${Math.round(elapsedSec / 60)} min).`, 'good');
      }
    }
    document.addEventListener('visibilitychange', catchUp);
    window.addEventListener('focus', catchUp);
    window.addEventListener('pageshow', catchUp);
    return () => {
      document.removeEventListener('visibilitychange', catchUp);
      window.removeEventListener('focus', catchUp);
      window.removeEventListener('pageshow', catchUp);
    };
  }, [loaded, showToast]);

  useEffect(() => {
    if (!loaded || !state || !state.tasks) return;
    const newlyDone = state.tasks.list.filter(id => {
      if (state.tasks.completed[id]) return false;
      const task = TASK_BY_ID[id];
      if (!task) return false;
      return task.progress(state) >= task.target(state.prestige);
    });
    if (newlyDone.length === 0) return;
    const reward = taskReward(state.prestige);
    setState(prev => {
      if (!prev || !prev.tasks) return prev;
      const completed = Object.assign({}, prev.tasks.completed);
      let gained = 0;
      newlyDone.forEach(id => {
        if (!completed[id]) { completed[id] = true; gained += reward; }
      });
      if (gained === 0) return prev;
      return Object.assign({}, prev, { prestigePoints: prev.prestigePoints + gained, tasks: Object.assign({}, prev.tasks, { completed }) });
    });
    newlyDone.forEach(id => showToast(`Task complete: ${TASK_BY_ID[id].desc(state.prestige)} (+${reward} pts)`, 'good'));
  }, [state, loaded]);

  useEffect(() => {
    if (!loaded || !state || !state.brewOff) return;
    const bo = state.brewOff;
    const boss = BREW_OFF_BY_ID[bo.bossId];
    if (!boss) return;
    const earned = Math.max(0, state.totalEarned - bo.startEarned);
    const now = Date.now();

    if (earned >= boss.target) {
      setState(prev => (prev && prev.brewOff && prev.brewOff.bossId === bo.bossId)
        ? Object.assign({}, prev, { brewOff: null, trophies: Object.assign({}, prev.trophies, { [boss.id]: true }) })
        : prev);
      showToast(`🏆 You beat ${boss.name}! ${boss.trophy} earned.`, 'good');
    } else if (now >= bo.endsAt) {
      setState(prev => (prev && prev.brewOff && prev.brewOff.bossId === bo.bossId)
        ? Object.assign({}, prev, { brewOff: null })
        : prev);
      showToast(`${boss.name} wins this round. Try again anytime.`, 'warn');
    }
  }, [state, loaded]);

  if (!loaded || !state) {
    return h('div', { style: { minHeight: '100vh', background: '#241A12', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#C9BBA3', fontFamily: 'Inter, sans-serif' } }, 'Uncorking the ledger…');
  }

  const totalPaid = state.totalPaid;
  const totalRate = totalRateOf(state);
  const debtCleared = isDebtCleared(state.debt);

  function unlockBeverage(id) {
    const bev = BEVERAGES.find(b => b.id === id);
    setState(prev => {
      const cost = effectiveUnlockCost(bev, prev);
      if (prev.cash < cost) { showToast('Not enough cash to unlock that.', 'warn'); return prev; }
      const beverages = Object.assign({}, prev.beverages, { [id]: Object.assign({}, prev.beverages[id], { level: 1 }) });
      showToast(`${bev.name} is now brewing.`, 'good');
      return Object.assign({}, prev, { cash: prev.cash - cost, beverages });
    });
  }

  function upgradeBeverage(id) {
    const bev = BEVERAGES.find(b => b.id === id);
    setState(prev => {
      const cur = prev.beverages[id];
      if (!cur || cur.level < 1) return prev;
      const cost = upgradeCostOf(bev, cur.level, prev);
      if (prev.cash < cost) { showToast('Not enough cash for that upgrade.', 'warn'); return prev; }
      const beverages = Object.assign({}, prev.beverages, { [id]: Object.assign({}, cur, { level: cur.level + 1 }) });
      return Object.assign({}, prev, { cash: prev.cash - cost, beverages });
    });
  }

  function tapBeverage(id) {
    const bev = BEVERAGES.find(b => b.id === id);
    setState(prev => {
      const cur = prev.beverages[id];
      if (!cur || cur.level < 1) return prev;
      if (Date.now() - (cur.lastTap || 0) < effectiveTapCooldown(prev)) return prev;
      const bonus = rateOf(bev, cur.level, prev) * TAP_SECONDS_WORTH;
      const beverages = Object.assign({}, prev.beverages, { [id]: Object.assign({}, cur, { lastTap: Date.now() }) });
      return Object.assign({}, prev, { cash: prev.cash + bonus, totalEarned: prev.totalEarned + bonus, beverages, tapCount: (prev.tapCount || 0) + 1 });
    });
  }

  function payDebt(amount) {
    setState(prev => {
      const pay = Math.min(amount, prev.cash, prev.debt);
      if (pay <= 0) return prev;
      return Object.assign({}, prev, { cash: prev.cash - pay, debt: settleDebt(prev.debt - pay), totalPaid: prev.totalPaid + pay });
    });
  }

  function investCash(amount) {
    setState(prev => {
      if (!isDebtCleared(prev.debt)) return prev;
      const amt = Math.min(amount, prev.cash);
      if (amt <= 0) return prev;
      return Object.assign({}, prev, { cash: prev.cash - amt, invested: (prev.invested || 0) + amt, totalPaid: prev.totalPaid + amt });
    });
  }

  function doPrestige() {
    setState(prev => {
      if (!isDebtCleared(prev.debt)) return prev;
      const newLevel = prev.prestige + 1;
      const pointsGained = pointsForPrestige(prev.prestige);
      showToast(`Prestiged to generation ${newLevel + 1} — +${pointsGained} prestige points.`, 'good');
      return Object.assign({}, prev, defaultRunState(newLevel), {
        debt: debtForRun(newLevel),
        totalEarned: prev.totalEarned,
        totalEarnedAtRunStart: prev.totalEarned,
        lastSeen: Date.now(),
        prestige: newLevel,
        prestigePoints: prev.prestigePoints + pointsGained,
        prestigeSpent: prev.prestigeSpent,
        prestigeUpgrades: prev.prestigeUpgrades,
      });
    });
    setConfirmingPrestige(false);
  }

  function buyPrestigeNode(nodeId) {
    const node = NODE_BY_ID[nodeId];
    setState(prev => {
      const rank = rankOf(prev, nodeId);
      if (rank >= NODE_MAX_RANK) return prev;
      const cost = nodeCostAt(node, rank);
      if (prev.prestigePoints < cost) { showToast('Not enough prestige points.', 'warn'); return prev; }
      return Object.assign({}, prev, {
        prestigePoints: prev.prestigePoints - cost,
        prestigeSpent: prev.prestigeSpent + cost,
        prestigeSpentThisRun: (prev.prestigeSpentThisRun || 0) + cost,
        prestigeUpgrades: Object.assign({}, prev.prestigeUpgrades, { [nodeId]: rank + 1 }),
      });
    });
  }

  function buyStoreItem(itemId) {
    const item = STORE_ITEM_BY_ID[itemId];
    setState(prev => {
      if (prev.store.owned[itemId]) return prev;
      if (prev.prestigePoints < item.cost) { showToast('Not enough prestige points.', 'warn'); return prev; }
      const owned = Object.assign({}, prev.store.owned, { [itemId]: true });
      const store = Object.assign({}, prev.store, { owned });
      if (item.type === 'background') store.background = itemId;
      if (item.type === 'iconPack') store.iconPack = itemId;
      showToast(`${item.name} unlocked!`, 'good');
      return Object.assign({}, prev, { prestigePoints: prev.prestigePoints - item.cost, store, storeItemsBoughtThisRun: (prev.storeItemsBoughtThisRun || 0) + 1 });
    });
  }

  function equipStoreItem(itemId) {
    const item = STORE_ITEM_BY_ID[itemId];
    setState(prev => {
      if (!isItemOwned(prev, itemId)) return prev;
      const store = Object.assign({}, prev.store);
      if (item.type === 'background') store.background = itemId;
      if (item.type === 'iconPack') store.iconPack = itemId;
      return Object.assign({}, prev, { store });
    });
  }

  function closeTutorial() {
    setTutorialOpen(false);
    setTutorialStep(0);
    setState(prev => prev && Object.assign({}, prev, { tutorialDismissed: true }));
  }
  function openTutorial() {
    setTutorialStep(0);
    setTutorialOpen(true);
  }
  function toggleAutoTap() {
    setState(prev => {
      if (!anyBeverageMaxed(prev)) return prev;
      return Object.assign({}, prev, { autoTapEnabled: !prev.autoTapEnabled });
    });
  }

  function startBrewOff(bossId) {
    const boss = BREW_OFF_BY_ID[bossId];
    setState(prev => {
      if (!boss) return prev;
      if (prev.prestige < boss.minLevel) return prev;
      if (prev.trophies[bossId]) return prev;
      if (prev.brewOff) return prev;
      const now = Date.now();
      showToast(`Brew Off started against ${boss.name} — 60 seconds!`, 'neutral');
      return Object.assign({}, prev, { brewOff: { bossId, startEarned: prev.totalEarned, startedAt: now, endsAt: now + BREW_OFF_DURATION_MS } });
    });
  }
  function cancelBrewOff() {
    setState(prev => prev && Object.assign({}, prev, { brewOff: null }));
  }

  function resetProgress() {
    const fresh = defaultState();
    setState(fresh);
    storage.set(SAVE_KEY, JSON.stringify(fresh)).catch(() => {});
    setConfirmingReset(false);
    setView('game');
    showToast('Progress reset — starting fresh.', 'neutral');
  }

  const payBtnStyle = { flex: 1, background: '#3A2C1D', border: '1px solid #5A4630', color: '#E0A93E', borderRadius: 8, padding: '9px 0', fontSize: 12.5, fontWeight: 600, fontFamily: 'Inter, sans-serif', cursor: 'pointer' };

  const icons = ICON_PACKS[state.store.iconPack] || ICON_PACKS.icons_classic;
  const bgGradient = BACKGROUND_THEMES[state.store.background] || BACKGROUND_THEMES.bg_classic;

  return h('div', { style: { minHeight: '100vh', background: bgGradient, fontFamily: 'Inter, sans-serif', color: '#E8DCC4', paddingBottom: 40 } },
    h('style', null, `
      @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-26px); } }
      .btn { transition: transform 0.12s ease, filter 0.12s ease; }
      .btn:active { transform: scale(0.96); }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn:not(:disabled):hover { filter: brightness(1.12); }
      .tap-card { transition: transform 0.1s ease; cursor: pointer; }
      .tap-card:active { transform: scale(0.985); }
    `),
    toast && h('div', {
      key: toast.id,
      style: {
        position: 'fixed', top: 14, left: '50%', transform: 'translateX(-50%)', zIndex: 50,
        background: toast.tone === 'good' ? '#3C4F35' : toast.tone === 'warn' ? '#5C2B2B' : '#332619',
        border: `1px solid ${toast.tone === 'good' ? '#6B8A5E' : toast.tone === 'warn' ? '#A13D3D' : '#5A4630'}`,
        color: '#EDE3D0', padding: '8px 16px', borderRadius: 8, fontSize: 13, fontFamily: 'Inter, sans-serif',
        animation: 'toastIn 0.25s ease', boxShadow: '0 4px 16px rgba(0,0,0,0.4)', maxWidth: '90vw', textAlign: 'center',
      },
      onAnimationEnd: () => { clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToast(null), 3200); },
    }, toast.msg),

    tutorialOpen && h(TutorialOverlay, { step: tutorialStep, onNext: () => setTutorialStep(s => Math.min(TUTORIAL_STEPS.length - 1, s + 1)), onBack: () => setTutorialStep(s => Math.max(0, s - 1)), onClose: closeTutorial }),

    h('div', { style: { padding: '14px 16px 12px', borderBottom: '1px solid #3A2C1D' } },
      h('div', { id: 'nav-buttons', style: { display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'flex-end', marginBottom: 12 } },
        h('button', {
          id: 'nav-tree',
          onClick: () => setView(v => v === 'tree' ? 'game' : 'tree'), 'aria-label': 'Prestige tree',
          style: { height: 28, borderRadius: 14, padding: '0 12px', background: view === 'tree' ? '#4A3D6B' : '#3A2C1D', border: `1px solid ${view === 'tree' ? '#6B5A9C' : '#5A4630'}`, color: view === 'tree' ? '#E5D9FF' : '#E0A93E', fontSize: 12, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap' },
        }, view === 'tree' ? '← Brewery' : '🌳 Tree'),
        h('button', {
          onClick: () => setView(v => v === 'store' ? 'game' : 'store'), 'aria-label': 'Store',
          style: { height: 28, borderRadius: 14, padding: '0 12px', background: view === 'store' ? '#4A3D6B' : '#3A2C1D', border: `1px solid ${view === 'store' ? '#6B5A9C' : '#5A4630'}`, color: view === 'store' ? '#E5D9FF' : '#E0A93E', fontSize: 12, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap' },
        }, view === 'store' ? '← Brewery' : '🛍️ Store'),
        h('button', {
          onClick: () => setView(v => v === 'achievements' ? 'game' : 'achievements'), 'aria-label': 'Achievements',
          style: { height: 28, borderRadius: 14, padding: '0 12px', background: view === 'achievements' ? '#4A3D6B' : '#3A2C1D', border: `1px solid ${view === 'achievements' ? '#6B5A9C' : '#5A4630'}`, color: view === 'achievements' ? '#E5D9FF' : '#E0A93E', fontSize: 12, fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap' },
        }, view === 'achievements' ? '← Brewery' : '🏆 Trophies'),
        h('button', {
          onClick: openTutorial, 'aria-label': 'Show tutorial',
          style: { flexShrink: 0, width: 28, height: 28, borderRadius: '50%', background: '#3A2C1D', border: '1px solid #5A4630', color: '#E0A93E', fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' },
        }, '?'),
        h('button', {
          onClick: () => setView(v => v === 'settings' ? 'game' : 'settings'), 'aria-label': 'Settings',
          style: { flexShrink: 0, width: 28, height: 28, borderRadius: '50%', background: view === 'settings' ? '#4A3D6B' : '#3A2C1D', border: `1px solid ${view === 'settings' ? '#6B5A9C' : '#5A4630'}`, color: view === 'settings' ? '#E5D9FF' : '#E0A93E', fontSize: 13, fontWeight: 700, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' },
        }, '⚙️')
      ),
      h('div', { id: 'app-title', style: { display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' } },
        h('h1', { style: { fontFamily: 'Fraunces, serif', fontWeight: 700, fontSize: 26, margin: 0, color: '#E0A93E', letterSpacing: 0.3 } }, 'Idle Brew'),
        h('span', { style: { fontSize: 11, color: '#8A7860', fontFamily: 'JetBrains Mono, monospace' } }, `gen. ${state.prestige + 1}`)
      ),
      h('p', { style: { margin: '4px 0 0', fontSize: 12.5, color: '#A6957A' } }, "Every pour adds up — even when you're not watching."),
      state.autoTapEnabled && autoTappingCount(state) > 0 && h('div', { style: { marginTop: 4, fontSize: 10.5, color: '#D4AF2C', fontWeight: 600 } }, `🤖 Auto-Tap running on ${autoTappingCount(state)} mastered beverage${autoTappingCount(state) === 1 ? '' : 's'}`)
    ),

    view === 'store'
      ? h(StoreView, { state: state, icons: icons, onBuy: buyStoreItem, onEquip: equipStoreItem })
      : view === 'tree'
      ? h(PrestigeTreeView, { state: state, icons: icons, onBuy: buyPrestigeNode, onToggleAutoTap: toggleAutoTap })
      : view === 'achievements'
      ? h(AchievementsView, { state: state, icons: icons, onStartBrewOff: startBrewOff, onCancelBrewOff: cancelBrewOff })
      : view === 'settings'
      ? h(SettingsView, { confirmingReset: confirmingReset, onConfirmReset: () => setConfirmingReset(true), onCancelReset: () => setConfirmingReset(false), onReset: resetProgress })
      : h(React.Fragment, null,

    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, padding: '14px 16px' } },
      h(LedgerCard, { icon: icons.cash, label: 'Cash', value: fmtCompact(state.cash), color: '#E0A93E' }),
      debtCleared
        ? h(LedgerCard, { id: 'ledger-debt', icon: '📥', label: 'Invested', value: fmtCompact(state.invested || 0), color: '#9CC28A' })
        : h(LedgerCard, { id: 'ledger-debt', icon: icons.debt, label: 'Debt', value: fmtCompact(state.debt), color: '#C15C5C', bleed: Math.min(1, state.debt / debtForRun(state.prestige)) }),
      h(LedgerCard, { id: 'ledger-income', icon: icons.income, label: 'Income', value: `${fmtCompact(totalRate)}/sec`, color: '#9CC28A' }),
      h(LedgerCard, { icon: icons.lifetime, label: 'Lifetime earned', value: fmtCompact(state.totalEarned), color: '#B49BD1' })
    ),

    h('button', {
      onClick: () => setView('tree'),
      style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: 'calc(100% - 32px)', margin: '0 16px 14px', background: '#2A2233', border: '1px solid #4A3D5C', borderRadius: 10, padding: '10px 14px', cursor: 'pointer' },
    },
      h('span', { style: { fontSize: 12.5, color: '#C9B8E8', fontWeight: 600 } }, `${icons.prestige} ${state.prestigePoints} prestige points`),
      h('span', { style: { fontSize: 11, color: '#8A7CA0' } }, 'Spend in Tree →')
    ),

    h(TasksCard, { state: state }),

    !debtCleared && h('div', { style: { padding: '0 16px 16px', display: 'flex', flexWrap: 'wrap', gap: 8 } },
      unlockedPayTiers(state).map(amt => h(HoldableButton, {
        key: amt, className: 'btn', disabled: state.cash <= 0,
        onAction: () => payDebt(Math.min(state.cash, amt)),
        style: Object.assign({}, payBtnStyle, { flex: '1 1 28%', minWidth: 92 }),
      }, `Pay ${fmtCompact(amt)}`)),
      h(HoldableButton, {
        className: 'btn', disabled: state.cash <= 0, onAction: () => payDebt(state.cash),
        style: Object.assign({}, payBtnStyle, { flex: '1 1 28%', minWidth: 92, background: '#4A3A24', borderColor: '#6B5636' }),
      }, 'Pay all')
    ),

    debtCleared && h('div', { style: { padding: '0 16px 6px' } },
      h('div', { style: { fontSize: 10.5, color: '#8A7860', marginBottom: 8 } }, `Debt's clear — invest surplus cash instead. It keeps counting toward tier unlocks, and pays you ${fmtMoney(INVEST_RATE_PER_SEC * 100)}/sec back per $100 invested, forever.`),
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 8 } },
        unlockedPayTiers(state).map(amt => h(HoldableButton, {
          key: amt, className: 'btn', disabled: state.cash <= 0,
          onAction: () => investCash(Math.min(state.cash, amt)),
          style: Object.assign({}, payBtnStyle, { flex: '1 1 28%', minWidth: 92, background: '#2F3A2C', border: '1px solid #4E6247', color: '#9CC28A' }),
        }, `Invest ${fmtCompact(amt)}`)),
        h(HoldableButton, {
          className: 'btn', disabled: state.cash <= 0, onAction: () => investCash(state.cash),
          style: Object.assign({}, payBtnStyle, { flex: '1 1 28%', minWidth: 92, background: '#3A4A34', border: '1px solid #5E7C53', color: '#C4E0B5' }),
        }, 'Invest all')
      )
    ),

    !debtCleared && h('div', { style: { margin: '0 16px 16px', fontSize: 11, color: '#8A7CA0', background: '#241A2E', border: '1px solid #3D3350', borderRadius: 10, padding: '10px 14px' } },
      'Clear your debt to prestige — reset the run, take on more debt next time, and earn points to spend permanently in the Tree.'
    ),

    debtCleared && h('div', { style: { margin: '0 16px 16px', background: '#2A2233', border: '1px solid #4A3D5C', borderRadius: 10, padding: 12 } },
      !confirmingPrestige && h('button', {
        className: 'btn', onClick: () => setConfirmingPrestige(true),
        style: { width: '100%', background: '#4A3D6B', border: '1px solid #6B5A9C', borderRadius: 8, padding: '9px 0', color: '#E5D9FF', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 },
      }, h('span', { style: { fontSize: 13 } }, icons.reset), ` Prestige now — earn ${pointsForPrestige(state.prestige)} points`),
      confirmingPrestige && h('div', null,
        h('div', { style: { fontSize: 11, color: '#C9B8E8', marginBottom: 8 } }, `This resets cash, debt, and beverage levels. Next run starts at ${fmtMoney(debtForRun(state.prestige + 1))} debt. Prestige Tree upgrades are never lost.`),
        h('div', { style: { display: 'flex', gap: 8 } },
          h('button', { className: 'btn', onClick: doPrestige, style: { flex: 1, background: '#4A3D6B', border: '1px solid #6B5A9C', borderRadius: 8, padding: '8px 0', color: '#E5D9FF', fontSize: 12, fontWeight: 600, cursor: 'pointer' } }, 'Confirm prestige'),
          h('button', { className: 'btn', onClick: () => setConfirmingPrestige(false), style: { flex: 1, background: 'none', border: '1px solid #4A3D5C', borderRadius: 8, padding: '8px 0', color: '#8A7CA0', fontSize: 12, cursor: 'pointer' } }, 'Cancel')
        )
      )
    ),

    h('div', { style: { padding: '0 16px' } },
      h(SectionLabel, { id: 'beverages-section', text: 'Beverages' }),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 18 } },
        Object.keys(CATEGORY_LABELS).map(cat => {
          const items = BEVERAGES.filter(b => b.category === cat);
          if (items.length === 0) return null;
          return h('div', { key: cat },
            h('div', { style: { fontSize: 11, fontWeight: 700, color: CATEGORY_STYLES[cat].accent, letterSpacing: 0.6, textTransform: 'uppercase', marginBottom: 8, fontFamily: 'JetBrains Mono, monospace' } }, CATEGORY_LABELS[cat]),
            h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },
              items.map(b => {
                const unlockedTank = totalPaid >= b.unlockDebtPaid;
                const cur = state.beverages[b.id];
                return h(BeverageCard, {
                  key: b.id, bev: b, bevState: cur, debtUnlocked: unlockedTank, cash: state.cash, icons: icons, tapCooldown: effectiveTapCooldown(state),
                  domId: b.id === 'house' ? 'beverage-house' : undefined,
                  rate: rateOf(b, cur.level, state),
                  nextRate: rateOf(b, cur.level + 1, state),
                  nextCost: cur.level > 0 ? upgradeCostOf(b, cur.level, state) : effectiveUnlockCost(b, state),
                  onUnlock: unlockBeverage, onUpgrade: upgradeBeverage, onTap: tapBeverage,
                });
              })
            )
          );
        })
      )
    ),

    h('div', { style: { padding: '18px 16px 0', fontSize: 11, color: '#6B5D48', textAlign: 'center' } },
      "Progress saves automatically in this browser. Tap a brewing beverage for a quick bonus — it's worth more than just letting it run."
    )
      )
  );
}

function HoldableButton(props) {
  const { onAction, disabled, children, style, className } = props;
  const timerRef = useRef(null);
  const stop = () => { if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; } };
  const start = () => {
    if (disabled || timerRef.current) return;
    onAction();
    timerRef.current = setInterval(onAction, 130);
  };
  useEffect(() => stop, []);
  return h('button', {
    className, disabled,
    onMouseDown: start, onMouseUp: stop, onMouseLeave: stop,
    onTouchStart: (e) => { e.preventDefault(); start(); }, onTouchEnd: stop, onTouchCancel: stop,
    style,
  }, children);
}

function SectionLabel(props) {
  return h('div', { id: props.id, style: { fontFamily: 'Fraunces, serif', fontSize: 14, fontWeight: 600, color: '#B99A5B', marginBottom: 8, letterSpacing: 0.4, textTransform: 'uppercase' } }, props.text);
}

function TasksCard(props) {
  const { state } = props;
  if (!state.tasks) return null;
  const reward = taskReward(state.prestige);
  return h('div', { style: { margin: '0 16px 14px', background: '#1E2A20', border: '1px solid #354A38', borderRadius: 10, padding: 12 } },
    h('div', { style: { fontSize: 11, fontWeight: 700, color: '#9CC28A', letterSpacing: 0.5, textTransform: 'uppercase', marginBottom: 8 } }, `📋 Tasks this run · +${reward} pts each`),
    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 7 } },
      state.tasks.list.map(id => {
        const task = TASK_BY_ID[id];
        if (!task) return null;
        const done = !!state.tasks.completed[id];
        const target = task.target(state.prestige);
        const progress = Math.min(target, task.progress(state));
        return h('div', { key: id, style: { display: 'flex', alignItems: 'center', gap: 8 } },
          h('span', { style: { fontSize: 13, color: done ? '#9CC28A' : '#4A5A45', flexShrink: 0 } }, done ? '✅' : '⬡'),
          h('span', { style: { fontSize: 11.5, color: done ? '#8FAE85' : '#C9BBA3', flex: 1, textDecoration: done ? 'line-through' : 'none' } }, task.desc(state.prestige)),
          h('span', { style: { fontSize: 10, color: '#6B8A5E', fontFamily: 'JetBrains Mono, monospace', flexShrink: 0 } }, `${fmtNum(progress)}/${fmtNum(target)}`)
        );
      })
    )
  );
}

function LedgerCard(props) {
  const { id, icon, label, value, color, bleed } = props;
  return h('div', { id: id, style: { position: 'relative', background: '#EDE3D0', borderRadius: 8, padding: '10px 12px', overflow: 'hidden', boxShadow: 'inset 0 0 0 1px rgba(0,0,0,0.08)' } },
    bleed !== undefined && h('div', { style: { position: 'absolute', left: 0, bottom: 0, width: '100%', height: `${bleed * 100}%`, background: 'linear-gradient(180deg, rgba(161,61,61,0.05), rgba(161,61,61,0.22))', pointerEvents: 'none' } }),
    h('div', { style: { position: 'relative', display: 'flex', alignItems: 'center', gap: 6, color: '#7A6A4E', fontSize: 10.5, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 } },
      h('span', { style: { fontSize: 13 } }, icon), ' ', label
    ),
    h('div', { style: { position: 'relative', fontFamily: 'JetBrains Mono, monospace', fontSize: 17, fontWeight: 700, color: '#2B2018', marginTop: 3 } },
      h('span', { style: { color: color } }, value)
    )
  );
}

function BeverageCard(props) {
  const { bev, bevState, debtUnlocked, cash, rate, nextRate, nextCost, onUnlock, onUpgrade, onTap } = props;
  const icons = props.icons || ICON_PACKS.icons_classic;
  const tapCooldown = props.tapCooldown || TAP_COOLDOWN;
  const [pops, setPops] = useState([]);
  const owned = bevState.level > 0;
  const tapReady = owned && Date.now() - (bevState.lastTap || 0) >= tapCooldown;

  if (!debtUnlocked) {
    return h('div', { style: { background: '#241A12', border: '1px dashed #3A2C1D', borderRadius: 10, padding: 14, display: 'flex', alignItems: 'center', gap: 10, color: '#5A4A38' } },
      h('span', { style: { fontSize: 16 } }, icons.lock),
      h('div', { style: { fontSize: 12, fontFamily: 'JetBrains Mono, monospace' } }, `${bev.name} — pay down ${fmtCompact(bev.unlockDebtPaid)} total to unlock`)
    );
  }

  function handleTap() {
    if (!tapReady) return;
    const bonus = rate * TAP_SECONDS_WORTH;
    const id = Math.random();
    setPops(p => [...p, { id, text: `+${fmtMoney(bonus)}` }]);
    setTimeout(() => setPops(p => p.filter(x => x.id !== id)), 700);
    onTap(bev.id);
  }

  const style = CATEGORY_STYLES[bev.category] || CATEGORY_STYLES.beer;

  return h('div', {
    id: props.domId,
    className: owned ? 'tap-card' : '',
    onClick: owned ? handleTap : undefined,
    style: { position: 'relative', background: style.bg, border: `1px solid ${style.border}`, borderRadius: 10, padding: 12, overflow: 'hidden' },
  },
    pops.map(p => h('div', { key: p.id, style: { position: 'absolute', top: 10, right: 14, fontSize: 13, fontWeight: 700, color: style.accent, fontFamily: 'JetBrains Mono, monospace', animation: 'floatUp 0.7s ease forwards', pointerEvents: 'none' } }, p.text)),
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' } },
      h('div', null,
        h('div', { style: { fontSize: 14, fontWeight: 700, color: '#E8DCC4', fontFamily: 'Fraunces, serif' } }, bev.name),
        owned
          ? h('div', { style: { fontSize: 11, color: style.accentSoft, fontFamily: 'JetBrains Mono, monospace', marginTop: 2 } }, `Proficiency Lv.${bevState.level} · ${fmtCompact(rate)}/sec`)
          : h('div', { style: { fontSize: 11, color: style.accentSoft, fontFamily: 'JetBrains Mono, monospace', marginTop: 2 } }, `Not brewing yet · base ${fmtCompact(bev.baseRate)}/sec`)
      ),
      owned && h('div', { style: { fontSize: 9.5, color: tapReady ? style.accent : '#5A4A38', display: 'flex', alignItems: 'center', gap: 3, fontFamily: 'JetBrains Mono, monospace', flexShrink: 0 } },
        h('span', { style: { fontSize: 11 } }, icons.tap), ' ', tapReady ? 'tap for bonus' : 'cooling down'
      )
    ),
    h('div', { style: { marginTop: 10 } },
      owned
        ? h('button', {
            className: 'btn', disabled: cash < nextCost,
            onClick: (e) => { e.stopPropagation(); onUpgrade(bev.id); },
            style: { width: '100%', background: style.border, border: `1px solid ${style.accentSoft}`, borderRadius: 7, padding: '8px 0', color: style.accent, fontSize: 12, fontWeight: 600, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 5 },
          }, h('span', { style: { fontSize: 13 } }, icons.upgrade), ` Improve proficiency — ${fmtCompact(nextCost)} → ${fmtCompact(nextRate)}/sec`)
        : h('button', {
            className: 'btn', disabled: cash < nextCost,
            onClick: (e) => { e.stopPropagation(); onUnlock(bev.id); },
            style: { width: '100%', background: '#2F3A2C', border: '1px solid #4E6247', borderRadius: 7, padding: '8px 0', color: '#9CC28A', fontSize: 12, fontWeight: 600, cursor: 'pointer' },
          }, `Start brewing — ${costLabel(nextCost)}`)
    )
  );
}

function TreeNodeButton(props) {
  const { node, pos, rank, maxed, selected, accent, onClick } = props;
  const fillPct = Math.round((rank / NODE_MAX_RANK) * 100);
  return h('button', {
    onClick, 'aria-label': node.name,
    style: {
      position: 'absolute', left: `${pos.x}%`, top: `${pos.y}%`, transform: 'translate(-50%, -50%)',
      width: 44, height: 44, borderRadius: '50%', cursor: 'pointer', padding: 0,
      border: `2px solid ${selected ? '#FFFFFF' : 'rgba(255,255,255,0.28)'}`,
      background: `linear-gradient(to top, ${accent} ${fillPct}%, rgba(20,14,10,0.55) ${fillPct}%)`,
      boxShadow: maxed ? `0 0 10px ${accent}` : '0 1px 4px rgba(0,0,0,0.4)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: 12, fontWeight: 800, color: '#FFF9EC', fontFamily: 'JetBrains Mono, monospace',

function PrestigeTierBlock(props) {
  const { tier, state, onBuy } = props;
  const icons = props.icons || ICON_PACKS.icons_classic;
  const [selectedId, setSelectedId] = useState(tier.nodes[0].id);
  const tierUnlocked = state.prestigeSpent >= tier.requiredSpent;

  if (!tierUnlocked) {
    return h('div', { style: { background: '#241A2E', border: '1px solid #3D3350', borderRadius: 10, padding: 12, opacity: 0.6 } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
        h('div', { style: { fontSize: 12, fontWeight: 700, color: '#C9B8E8', fontFamily: 'Fraunces, serif' } }, tier.label),
        h('span', { style: { fontSize: 10, color: '#8A7CA0', fontFamily: 'JetBrains Mono, monospace', display: 'flex', alignItems: 'center', gap: 3 } },
          h('span', { style: { fontSize: 10 } }, icons.lock), ` spend ${tier.requiredSpent} pts to unlock`
        )
      )
    );
  }

  const category = (BEVERAGES.find(b => b.id === tier.nodes[0].beverageId) || {}).category || 'beer';
  const catStyle = CATEGORY_STYLES[category];
  const outline = GLASS_OUTLINES[category] || GLASS_OUTLINES.beer;
  const indexTable = category === 'wine' ? WINE_NODE_INDICES : REAL_NODE_INDICES;
  const realIndices = indexTable[tier.nodes.length] || indexTable[4];
  const polygonPoints = outline.map(p => `${p.x},${p.y}`).join(' ');
  const selectedNode = tier.nodes.find(n => n.id === selectedId) || tier.nodes[0];
  const rank = rankOf(state, selectedNode.id);
  const maxed = rank >= NODE_MAX_RANK;
  const cost = maxed ? null : nodeCostAt(selectedNode, rank);
  const bev = BEVERAGES.find(b => b.id === selectedNode.beverageId);
  const desc = selectedNode.type === 'rate'
    ? `+${Math.round(RATE_EFFECT_PER_RANK * 100)}% ${bev.name} rate / rank`
    : `-${Math.round(COST_EFFECT_PER_RANK * 100)}% ${bev.name} costs / rank`;

  return h('div', { style: { background: '#241A2E', border: '1px solid #3D3350', borderRadius: 10, padding: 12 } },
    h('div', { style: { fontSize: 12, fontWeight: 700, color: '#C9B8E8', fontFamily: 'Fraunces, serif', marginBottom: 8 } }, tier.label),

    h('div', { style: { position: 'relative', height: 190, margin: '4px auto 10px', maxWidth: 220 } },
      h('svg', { viewBox: '0 0 100 100', preserveAspectRatio: 'none', style: { position: 'absolute', inset: 0, width: '100%', height: '100%' } },
        h('polygon', { points: polygonPoints, fill: `${catStyle.accent}22`, stroke: `${catStyle.accent}AA`, strokeWidth: 1.4, strokeLinejoin: 'round' }),
        category === 'cider' && h('path', { d: 'M 75 32 A 16 16 0 0 1 75 68', fill: 'none', stroke: `${catStyle.accent}AA`, strokeWidth: 1.4 })
      ),
      outline.map((pt, i) => {
        const nodeIdx = realIndices.indexOf(i);
        if (nodeIdx === -1) {
          return h('div', {
            key: `deco-${i}`,
            style: { position: 'absolute', left: `${pt.x}%`, top: `${pt.y}%`, transform: 'translate(-50%, -50%)', width: 7, height: 7, borderRadius: '50%', background: catStyle.accent, opacity: 0.5 },
          });
        }
        const node = tier.nodes[nodeIdx];
        return h(TreeNodeButton, {
          key: node.id, node: node, pos: pt,
          rank: rankOf(state, node.id), maxed: rankOf(state, node.id) >= NODE_MAX_RANK,
          selected: node.id === selectedId, accent: catStyle.accent,
          onClick: () => setSelectedId(node.id),
        });
      })
    ),

    h('div', { style: { background: '#2A2233', borderRadius: 8, padding: '9px 11px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 } },
      h('div', { style: { minWidth: 0 } },
        h('div', { style: { fontSize: 11.5, fontWeight: 600, color: '#E5D9FF' } }, selectedNode.name, ' ', h('span', { style: { color: '#8A7CA0', fontWeight: 400 } }, `Lv.${rank}/${NODE_MAX_RANK}`)),
        h('div', { style: { fontSize: 10, color: '#8A7CA0', fontFamily: 'JetBrains Mono, monospace' } }, desc)
      ),
      h('button', {
        className: 'btn', disabled: maxed || state.prestigePoints < cost,
        onClick: () => onBuy(selectedNode.id),
        style: { flexShrink: 0, background: maxed ? 'none' : '#4A3D6B', border: `1px solid ${maxed ? '#3D3350' : '#6B5A9C'}`, borderRadius: 6, padding: '6px 10px', color: maxed ? '#8A7CA0' : '#E5D9FF', fontSize: 11, fontWeight: 600, cursor: maxed ? 'default' : 'pointer' },
      }, maxed ? 'Maxed' : `${cost} pt${cost === 1 ? '' : 's'}`)
    )
  );
}

function BossCard(props) {
  const { boss, state, now, icons, onStart, onCancel } = props;
  const won = !!state.trophies[boss.id];
  const unlocked = state.prestige >= boss.minLevel;
  const active = state.brewOff && state.brewOff.bossId === boss.id;
  const otherActive = state.brewOff && state.brewOff.bossId !== boss.id;

  if (!unlocked) {
    return h('div', { style: { background: '#241A12', border: '1px dashed #3A2C1D', borderRadius: 10, padding: 14, display: 'flex', alignItems: 'center', gap: 10, color: '#5A4A38' } },
      h('span', { style: { fontSize: 18 } }, icons.lock),
      h('div', { style: { fontSize: 12, fontFamily: 'JetBrains Mono, monospace' } }, `Reach prestige generation ${boss.minLevel + 1} to challenge ${boss.name}`)
    );
  }

  const earned = active ? Math.max(0, state.totalEarned - state.brewOff.startEarned) : 0;
  const pct = active ? Math.min(100, (earned / boss.target) * 100) : 0;
  const secondsLeft = active ? Math.max(0, Math.ceil((state.brewOff.endsAt - now) / 1000)) : 0;

  return h('div', { style: { background: won ? 'linear-gradient(135deg, #3A2E1A, #2A2233)' : '#2C2116', border: `1px solid ${won ? '#D4AF2C' : '#3A2C1D'}`, borderRadius: 10, padding: 12 } },
    h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
      h('div', { style: { fontSize: 26, flexShrink: 0 } }, boss.icon),
      h('div', { style: { flex: 1, minWidth: 0 } },
        h('div', { style: { fontSize: 13.5, fontWeight: 700, color: '#E8DCC4', fontFamily: 'Fraunces, serif' } }, boss.name),
        h('div', { style: { fontSize: 10.5, color: won ? '#F0D98C' : '#8A7860', marginTop: 1 } }, won ? `✓ ${boss.trophy} won` : `${boss.trophy} · earn ${fmtCompact(boss.target)} in 60s`)
      )
    ),
    active && h('div', { style: { marginTop: 10 } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: '#C9BBA3', marginBottom: 4, fontFamily: 'JetBrains Mono, monospace' } },
        h('span', null, `${fmtCompact(earned)} / ${fmtCompact(boss.target)}`),
        h('span', null, `${secondsLeft}s left`)
      ),
      h('div', { style: { height: 8, borderRadius: 4, background: '#1B140D', overflow: 'hidden' } },
        h('div', { style: { height: '100%', width: `${pct}%`, background: 'linear-gradient(90deg, #E0A93E, #D4AF2C)', transition: 'width 0.2s linear' } })
      ),
      h('button', { className: 'btn', onClick: onCancel, style: { marginTop: 8, width: '100%', background: 'none', border: '1px solid #4A3826', borderRadius: 7, padding: '6px 0', color: '#8A7860', fontSize: 11, cursor: 'pointer' } }, 'Give up')
    ),
    !active && !won && h('button', {
      className: 'btn', disabled: otherActive, onClick: () => onStart(boss.id),
      style: { marginTop: 10, width: '100%', background: '#3A2C1D', border: '1px solid #5A4630', borderRadius: 7, padding: '8px 0', color: otherActive ? '#5A4A38' : '#E0A93E', fontSize: 12, fontWeight: 600, cursor: otherActive ? 'default' : 'pointer' },
    }, otherActive ? 'Finish your current Brew Off first' : `Challenge ${boss.name}`)
  );
}

}

function StoreItemCard(props) {
  const { item, state, onBuy, onEquip } = props;
  const owned = isItemOwned(state, item.id);
  const equipped = (item.type === 'background' && state.store.background === item.id) ||
                    (item.type === 'iconPack' && state.store.iconPack === item.id);
  const affordable = state.prestigePoints >= item.cost;

  const preview = item.type === 'background'
    ? h('div', { style: { width: 34, height: 34, borderRadius: 8, background: BACKGROUND_THEMES[item.id], border: '1px solid rgba(255,255,255,0.15)', flexShrink: 0 } })
    : item.type === 'iconPack'
    ? h('div', { style: { width: 34, height: 34, borderRadius: 8, background: '#241A12', border: '1px solid #3A2C1D', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 } }, ICON_PACKS[item.id].cash)
    : item.type === 'categoryBoost'
    ? h('div', { style: { width: 34, height: 34, borderRadius: 8, background: `${CATEGORY_STYLES[item.category].accent}33`, border: `1px solid ${CATEGORY_STYLES[item.category].accent}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 } }, '🔧')
    : item.type === 'payTier'
    ? h('div', { style: { width: 34, height: 34, borderRadius: 8, background: '#2F3A2C', border: '1px solid #4E6247', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 } }, '💵')
    : h('div', { style: { width: 34, height: 34, borderRadius: 8, background: '#241A12', border: '1px solid #3A2C1D', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 } }, '⭐');

  return h('div', { style: { display: 'flex', alignItems: 'center', gap: 10, background: '#2C2116', border: `1px solid ${equipped ? '#E0A93E' : '#3A2C1D'}`, borderRadius: 10, padding: 10 } },
    preview,
    h('div', { style: { flex: 1, minWidth: 0 } },
      h('div', { style: { fontSize: 13, fontWeight: 700, color: '#E8DCC4', fontFamily: 'Fraunces, serif' } }, item.name),
      h('div', { style: { fontSize: 10.5, color: '#8A7860', marginTop: 1 } }, item.desc)
    ),
    equipped
      ? h('div', { style: { flexShrink: 0, fontSize: 10.5, color: '#E0A93E', fontWeight: 700, padding: '6px 10px' } }, 'Equipped')
      : owned
      ? ((item.type === 'boost' || item.type === 'categoryBoost' || item.type === 'payTier')
          ? h('div', { style: { flexShrink: 0, fontSize: 10.5, color: '#9CC28A', fontWeight: 700, padding: '6px 10px' } }, 'Owned ✓')
          : h('button', { className: 'btn', onClick: () => onEquip(item.id), style: { flexShrink: 0, background: '#3A2C1D', border: '1px solid #5A4630', borderRadius: 6, padding: '6px 10px', color: '#E0A93E', fontSize: 11, fontWeight: 600, cursor: 'pointer' } }, 'Equip'))
      : h('button', {
          className: 'btn', disabled: !affordable, onClick: () => onBuy(item.id),
          style: { flexShrink: 0, background: '#4A3D6B', border: '1px solid #6B5A9C', borderRadius: 6, padding: '6px 10px', color: '#E5D9FF', fontSize: 11, fontWeight: 600, cursor: affordable ? 'pointer' : 'not-allowed' },
        }, `${item.cost} pt${item.cost === 1 ? '' : 's'}`)
  );
}


function TutorialOverlay(props) {
  const { step, onNext, onBack, onClose } = props;
  const total = TUTORIAL_STEPS.length;
  const isLast = step === total - 1;
  const current = TUTORIAL_STEPS[step];
  const [rect, setRect] = useState(null);

  useEffect(() => {
    let cancelled = false;
    let rafId = null;
    setRect(null);

    function measureNow() {
      if (cancelled || !current.targetId) return;
      const el = document.getElementById(current.targetId);
      if (!el) return;
      const r = el.getBoundingClientRect();
      setRect(prev => {
        const next = { top: r.top, left: r.left, width: r.width, height: r.height };
        if (prev && prev.top === next.top && prev.left === next.left && prev.width === next.width && prev.height === next.height) return prev;
        return next;
      });
    }
    function scheduleMeasure() {
      if (rafId) return;
      rafId = requestAnimationFrame(() => { rafId = null; measureNow(); });
    }

    let scrollTimer = null;
    if (current.targetId) {
      const el = document.getElementById(current.targetId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      scrollTimer = setTimeout(measureNow, 380);
    }

    window.addEventListener('scroll', scheduleMeasure, true);
    window.addEventListener('resize', scheduleMeasure);
    const keepInSync = setInterval(measureNow, 500);

    return () => {
      cancelled = true;
      if (rafId) cancelAnimationFrame(rafId);
      if (scrollTimer) clearTimeout(scrollTimer);
      window.removeEventListener('scroll', scheduleMeasure, true);
      window.removeEventListener('resize', scheduleMeasure);
      clearInterval(keepInSync);
    };
  }, [step, current.targetId]);

  const pad = 8;
  const viewportH = typeof window !== 'undefined' ? window.innerHeight : 800;
  let calloutStyle = { position: 'fixed', left: 16, right: 16, maxWidth: 460, margin: '0 auto', zIndex: 103 };
  if (rect) {
    const spaceBelow = viewportH - (rect.top + rect.height);
    const spaceAbove = rect.top;
    if (spaceBelow >= 190 || spaceBelow >= spaceAbove) {
      calloutStyle.top = Math.min(viewportH - 20, rect.top + rect.height + pad + 14);
    } else {
      calloutStyle.bottom = Math.max(16, viewportH - rect.top + pad + 14);
    }
  } else {
    calloutStyle.top = '50%';
    calloutStyle.transform = 'translateY(-50%)';
  }

  return h('div', { style: { position: 'fixed', inset: 0, zIndex: 100 }, onClick: onClose },
    // Dimmed backdrop everywhere, with a cutout around the target via a huge box-shadow.
    rect
      ? h('div', {
          style: {
            position: 'fixed', top: rect.top - pad, left: rect.left - pad,
            width: rect.width + pad * 2, height: rect.height + pad * 2,
            borderRadius: 12, border: '2px solid #E0A93E',
            boxShadow: '0 0 0 9999px rgba(10,7,4,0.8)',
            zIndex: 101,
          },
        })
      : h('div', { style: { position: 'fixed', inset: 0, background: 'rgba(10,7,4,0.8)', zIndex: 101 } }),

    h('div', {
      onClick: (e) => e.stopPropagation(),
      style: Object.assign({ background: '#2C2116', border: '1px solid #4A3826', borderRadius: 14, padding: '18px 18px 20px', boxShadow: '0 8px 30px rgba(0,0,0,0.5)' }, calloutStyle),
    },
      h('div', { style: { display: 'flex', justifyContent: 'center', gap: 5, marginBottom: 14 } },
        TUTORIAL_STEPS.map((_, i) => h('div', { key: i, style: { width: i === step ? 16 : 6, height: 6, borderRadius: 3, background: i === step ? '#E0A93E' : '#4A3826', transition: 'width 0.2s ease' } }))
      ),
      h('div', { style: { fontFamily: 'Fraunces, serif', fontSize: 18, fontWeight: 700, color: '#E0A93E', marginBottom: 8 } }, current.title),
      h('div', { style: { fontSize: 13.5, color: '#C9BBA3', lineHeight: 1.6, marginBottom: 20 } }, current.body),
      h('div', { style: { display: 'flex', gap: 8 } },
        step > 0 && h('button', { onClick: onBack, style: { flex: 1, background: 'none', border: '1px solid #4A3826', borderRadius: 8, padding: '10px 0', color: '#8A7860', fontSize: 13, fontWeight: 600, cursor: 'pointer' } }, 'Back'),
        h('button', {
          onClick: isLast ? onClose : onNext,
          style: { flex: 2, background: '#E0A93E', border: 'none', borderRadius: 8, padding: '10px 0', color: '#241A12', fontSize: 13, fontWeight: 700, cursor: 'pointer' },
        }, isLast ? "Let's brew!" : 'Next')
      ),
      !isLast && h('button', { onClick: onClose, style: { display: 'block', margin: '12px auto 0', background: 'none', border: 'none', color: '#6B5D48', fontSize: 11.5, cursor: 'pointer' } }, 'Skip tutorial')
    )
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h(ErrorBoundary, null, h(Fermentary)));
} catch (err) {
  document.getElementById('root').innerHTML = '<div class="fermentary-msg"><h2>Something went wrong</h2><p>' + ((err && err.message) || 'Unknown error') + '</p></div>';
}

} // end runFermentary
</script>
</body>
