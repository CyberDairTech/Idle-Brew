<!doctype html>
<!-- rebuild-trigger: 2026-08-12 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Idle Brew — CyberDairTech</title>
  <meta name="description" content="Idle Brew — an incremental/idle game project by CyberDairTech">
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#f59e0b;color-scheme:dark}
    body{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;background:linear-gradient(180deg,#071022 0%,#071022 60%,#031022 100%);color:#e6eef8}
    .card{max-width:900px;width:calc(100% - 32px);background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.04);padding:32px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
    h1{margin:0 0 8px;font-size:28px}
    p.lead{margin:0 0 16px;color:#cfe6ff}
    .meta{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .btn{background:var(--accent);color:#071022;padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none}
    .screenshot{width:100%;height:360px;background:linear-gradient(135deg,#07102a,#082040);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#7fb0ff;font-weight:600;font-size:18px;border:1px dashed rgba(255,255,255,0.04)}
    footer{margin-top:18px;color:#85a9d9;font-size:13px}
    @media (max-width:600px){.screenshot{height:220px}}
  </style>
</head>
<body>
  <main class="card" role="main">
    <header>
      <h1>Idle Brew</h1>
      <p class="lead">A work-in-progress incremental game by CyberDairTech. This page is a simple project homepage served by GitHub Pages.</p>
    </header>

    <div class="meta">
      <a class="btn" href="https://github.com/CyberDairTech/Idle-Brew" target="_blank" rel="noopener">View repository</a>
      <a class="btn" href="https://github.com/CyberDairTech/Idle-Brew/actions" target="_blank" rel="noopener" style="background:#0ea5a4;color:white">Actions</a>
    </div>

    <section aria-label="Screenshot placeholder">
      <div class="screenshot" role="img" aria-label="Screenshot placeholder">
        <!-- Inline SVG placeholder -->
        <svg width="60%" height="60%" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" x2="1">
              <stop offset="0" stop-color="#0ea5a4" stop-opacity="0.18"/>
              <stop offset="1" stop-color="#f59e0b" stop-opacity="0.12"/>
            </linearGradient>
          </defs>
          <rect rx="12" width="600" height="220" fill="url(#g)"/>
          <g fill="#cfe6ff" font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">
            <text x="300" y="110">Screenshot placeholder</text>
          </g>
        </svg>
      </div>
    </section>

    <footer>
      Note: After creating the files, GitHub Pages can take a minute to publish. Test the site at:
      <div style="margin-top:6px;font-weight:700">https://cyberdairtech.github.io/Idle-Brew/</div>
    </footer>
  </main>
</body>
</html>
